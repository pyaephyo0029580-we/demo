<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Play - My Online Game</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 1000px;
            height: 650px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Back Button */
        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #30363d;
        }
        /* Main Center Box VBox */
        .center-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 350px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h2 {
            color: #f0f6fc;
            font-size: 24px;
            margin: 0;
            font-weight: bold;
        }
        .action-btn {
            width: 250px;
            height: 50px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .btn-create {
            background-color: #238636;
            color: white;
        }
        .btn-join {
            background-color: #1f6feb;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Back Button to Home -->
    <button class="back-btn" onclick="location.href='index.html'">&lt; Back to Home</button>

    <!-- Main Center Box -->
    <div class="center-box">
        <h2>SELECT GAME MODE</h2>
        <button class="action-btn btn-create" onclick="alert('Create Room clicked!')">CREATE ROOM</button>
        <button class="action-btn btn-join" onclick="alert('Join Room clicked!')">JOIN ROOM</button>
    </div>
</div>

</body>
</html>
