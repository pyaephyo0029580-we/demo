<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MyGaming - Sign Up</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            color: white;

            background:
                    radial-gradient(
                            circle at top,
                            #252b45,
                            #0c0f18
                    );
        }

        .signup-container {

            width: 430px;
            max-width: 92%;

            padding: 35px;

            border-radius: 18px;

            background:
                    rgba(
                            22,
                            27,
                            44,
                            0.96
                    );

            box-shadow:
                    0 20px 50px
                    rgba(
                            0,
                            0,
                            0,
                            0.4
                    );
        }

        .logo {

            width: 65px;
            height: 65px;

            margin:
                    0 auto
                    18px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 15px;

            background:
                    linear-gradient(
                            135deg,
                            #328cff,
                            #676cff
                    );

            font-size: 28px;
        }

        h1 {

            margin:
                    0
                    0
                    7px;

            text-align: center;

            font-size: 27px;
        }

        .subtitle {

            margin-bottom: 30px;

            text-align: center;

            color: #7e8db3;

            font-size: 14px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #e5eaff;

            font-weight: bold;

            font-size: 14px;
        }

        input {

            width: 100%;
            height: 50px;

            margin-bottom: 18px;

            padding:
                    0
                    15px;

            border:
                    1px solid
                    #3b4667;

            border-radius: 10px;

            outline: none;

            background: #171c2d;

            color: white;

            font-size: 15px;

            pointer-events: auto;

            position: relative;

            z-index: 2;
        }

        input:focus {

            border-color: #4c8dff;

            box-shadow:
                    0 0 0 2px
                    rgba(
                            76,
                            141,
                            255,
                            0.15
                    );
        }

        #message {

            min-height: 25px;

            margin-bottom: 12px;

            text-align: center;

            font-weight: bold;

            color: #ff8999;
        }

        #message.success {

            color: #5de6a5;
        }

        #signupButton {

            width: 100%;
            height: 50px;

            border: none;
            border-radius: 10px;

            background:
                    linear-gradient(
                            90deg,
                            #268bff,
                            #8174ff
                    );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            position: relative;

            z-index: 2;
        }

        #signupButton:hover {

            opacity: 0.95;
        }

        #signupButton:disabled {opacity: 0.55;

            cursor: not-allowed;
        }

        .login-link {

            margin-top: 20px;

            text-align: center;

            color: #aeb7cf;

            font-size: 14px;
        }

        .login-link a {

            color: #76b4ff;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="signup-container">

    <div class="logo">
        🎮
    </div>


    <h1>
        Create Your Game Account
    </h1>


    <div class="subtitle">
        Join MyGaming and start playing
    </div>


    <label for="username">
        Username
    </label>

    <input
            id="username"
            name="username"
            type="text"
            placeholder="Enter username"
            autocomplete="username">


    <label for="email">
        Email
    </label>

    <input
            id="email"
            name="email"
            type="email"
            placeholder="Enter email"
            autocomplete="email">


    <label for="password">
        Password
    </label>

    <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter password"
            autocomplete="new-password">


    <label for="confirmPassword">
        Confirm Password
    </label>

    <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Confirm password"
            autocomplete="new-password">


    <div id="message"></div>


    <button
            id="signupButton"
            type="button">

        Sign Up

    </button>


    <div class="login-link">

        I already have an account.

        <a href="/login.html">
            Login
        </a>

    </div>

</div>


<script>

    // =====================================================
    // ELEMENTS
    // =====================================================

    const usernameInput =
        document.getElementById(
            "username"
        );

    const emailInput =
        document.getElementById(
            "email"
        );

    const passwordInput =
        document.getElementById(
            "password"
        );

    const confirmPasswordInput =
        document.getElementById(
            "confirmPassword"
        );

    const message =
        document.getElementById(
            "message"
        );

    const signupButton =
        document.getElementById(
            "signupButton"
        );


    // =====================================================
    // MESSAGE
    // =====================================================

    function showError(text) {

        message.className =
            "";

        message.textContent =
            text;
    }


    function showSuccess(text) {

        message.className =
            "success";

        message.textContent =
            text;
    }


    // =====================================================
    // SIGNUP
    // =====================================================

    async function signupUser() {

        const username =
            usernameInput.value.trim();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        message.className =
            "";

        message.textContent =
            "";


        // -----------------------------
        // VALIDATION
        // -----------------------------

        if (!username) {

            showError(
                "Please enter username."
            );

            usernameInput.focus();

            return;
        }


        if (!email) {

            showError(
                "Please enter email."
            );

            emailInput.focus();

            return;
        }


        if (!password) {

            showError(
                "Please enter password."
            );

            passwordInput.focus();return;
        }


        if (!confirmPassword) {

            showError(
                "Please confirm password."
            );

            confirmPasswordInput.focus();

            return;
        }


        if (password !== confirmPassword) {

            showError(
                "Passwords do not match."
            );

            return;
        }


        // -----------------------------
        // BUTTON LOADING
        // -----------------------------

        signupButton.disabled =
            true;

        signupButton.textContent =
            "Creating Account...";


        try {

            // =============================================
            // IMPORTANT
            // DO NOT PUT localhost HERE
            // Relative API path works with Cloudflare too
            // =============================================

            const response =
                await fetch(
                    "/api/auth/signup",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "same-origin",

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                email:
                                    email,

                                password:
                                    password
                            })
                    }
                );


            // ---------------------------------------------
            // READ RAW SERVER RESPONSE
            // ---------------------------------------------

            const responseText =
                await response.text();


            console.log(
                "SIGNUP STATUS =",
                response.status
            );


            console.log(
                "SIGNUP RESPONSE =",
                responseText
            );


            let data;


            try {

                data =
                    JSON.parse(
                        responseText
                    );

            } catch (error) {

                showError(
                    "Server response error."
                );

                console.error(
                    "JSON ERROR:",
                    error
                );

                return;
            }


            // ---------------------------------------------
            // BACKEND ERROR
            // ---------------------------------------------

            if (!response.ok) {

                showError(
                    data.message ||
                    "Sign up failed."
                );

                return;
            }


            // ---------------------------------------------
            // SUCCESS
            // ---------------------------------------------

            if (data.success === true) {

                showSuccess(
                    data.message ||
                    "Account created successfully."
                );


                sessionStorage.setItem(
                    "verifyEmail",
                    email
                );


                // Small delay so success message
                // can render before redirect
                setTimeout(
                    function () {

                        window.location.href =
                            "/verifyemail.html?email="
                            + encodeURIComponent(
                                email
                            );

                    },
                    300
                );


                return;
            }


            // ---------------------------------------------
            // UNKNOWN RESPONSE
            // ---------------------------------------------

    showError(
                data.message ||
                "Sign up failed."
            );


        } catch (error) {

            console.error(
                "SIGNUP FETCH ERROR:",
                error
            );


            showError(
                "Cannot connect to server."
            );


        } finally {

            signupButton.disabled =
                false;

            signupButton.textContent =
                "Sign Up";
        }
    }


    // =====================================================
    // BUTTON CLICK
    // =====================================================

    signupButton.addEventListener(
        "click",
        function () {

            signupUser();
        }
    );


    // =====================================================
    // ENTER KEY
    // =====================================================

    confirmPasswordInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                signupUser();
            }
        }
    );

</script>


</body>

</html>
