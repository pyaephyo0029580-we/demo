<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>MyGaming - Verify Email</title>

  <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-container">

  <div class="auth-card">

    <div class="game-logo">✉️</div>

    <h1>Verify Email</h1>

    <p class="subtitle">
      We sent a 6-digit code to
    </p>

    <p
            id="emailDisplay"
            class="email-display">
    </p>


    <input
            id="code"
            class="code-input"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000">


    <p id="message"></p>


    <button
            id="verifyButton"
            class="main-button"
            onclick="verifyCode()">
      Verify
    </button>


    <button
            id="resendButton"
            class="secondary-button"
            onclick="resendCode()">
      Resend Code
    </button>


    <p class="switch-text">
      <a href="signup.html">
        ← Back to Sign Up
      </a>
    </p>

  </div>
</div>


<script>

  const params =
      new URLSearchParams(window.location.search);


  let email =
      params.get("email");


  if (!email) {

      email =
          sessionStorage.getItem(
              "verificationEmail"
          );
  }


  const emailDisplay =
      document.getElementById(
          "emailDisplay"
      );


  if (email) {

      emailDisplay.textContent = email;

  } else {

      emailDisplay.textContent =
          "Email information missing.";
  }


  async function verifyCode() {

      const code =
          document
              .getElementById("code")
              .value
              .trim();


      const message =
          document.getElementById(
              "message"
          );


      const button =
          document.getElementById(
              "verifyButton"
          );


      message.className = "error-message";
      message.textContent = "";


      if (!email) {

          message.textContent =
              "Email information is missing.";

          return;
      }


      if (!code) {

          message.textContent =
              "Please enter verification code.";

          return;
      }


      if (!/^\d{6}$/.test(code)) {

          message.textContent =
              "Please enter the 6-digit code.";

          return;
      }


      try {

          button.disabled = true;
          button.textContent = "Verifying...";


          const response =
              await fetch("/api/auth/verify", {

                  method: "POST",

                  headers: {
                      "Content-Type": "application/json"
                  },

                  body: JSON.stringify({
                      email: email,
                      code: code
                  })
              });


          const data =
              await response.json();


          if (!response.ok || !data.success) {

              message.textContent =
                  data.message ||
                  "Verification failed.";

              return;
          }


          message.className =
              "success-message";


          message.textContent =
              data.message ||
              "Email verified successfully!";


          sessionStorage.removeItem(
              "verificationEmail"
          );


          setTimeout(function () {

              window.location.href =
                  "login.html";

          }, 700);


      } catch (error) {

          console.error(error);

          message.textContent =
              "Cannot connect to server.";

      } finally {

          button.disabled = false;
          button.textContent = "Verify";
      }
  }


  async function resendCode() {

      const message =
          document.getElementById(
              "message"
          );


      const button =
          document.getElementById(
              "resendButton"
          );


      message.className =
          "error-message";

      message.textContent = "";


      if (!email) {message.textContent =
            "Email information is missing.";

        return;
    }


    try {

        button.disabled = true;
        button.textContent = "Sending...";


        const response =
            await fetch("/api/auth/resend", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email
                })
            });


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            message.textContent =
                data.message ||
                "Cannot resend code.";

            return;
        }


        message.className =
            "success-message";


        message.textContent =
            data.message ||
            "New verification code sent.";


    } catch (error) {

        console.error(error);

        message.textContent =
            "Cannot connect to server.";

    } finally {

        button.disabled = false;
        button.textContent = "Resend Code";
    }
}


document
    .getElementById("code")
    .addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 6);
        }
    );


document
    .getElementById("code")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                verifyCode();
            }
        }
    );

</script>

</body>
</html>
