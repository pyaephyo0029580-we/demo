<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>Hidden Truth</title>

  <style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        font-family: Arial, Helvetica, sans-serif;

        background: #02040a;

        color: white;
    }

    body {
        position: relative;

        background:
            radial-gradient(
                circle at center,
                #13264e 0%,
                #081225 42%,
                #02040a 100%
            );
    }

    .stars {
        position: absolute;
        inset: 0;

        pointer-events: none;

        opacity: 0.12;

        background-image:
            radial-gradient(
                rgba(255,255,255,0.9) 1px,
                transparent 1px
            );

        background-size: 48px 48px;
    }

    .stars-two {
        position: absolute;
        inset: 0;

        pointer-events: none;

        opacity: 0.08;

        background-image:
            radial-gradient(
                rgba(93,223,255,0.9) 1px,
                transparent 1px
            );

        background-size: 83px 83px;
        background-position: 20px 30px;
    }

    .vignette {
        position: absolute;
        inset: 0;

        z-index: 20;

        pointer-events: none;

        background:
            radial-gradient(
                circle,
                transparent 30%,
                rgba(0,0,0,0.30) 58%,
                rgba(0,0,0,0.90) 100%
            );
    }

    .story-screen {
        position: relative;

        z-index: 10;

        width: 100%;
        height: 100%;

        display: flex;

        justify-content: center;
        align-items: center;

        text-align: center;

        padding: 30px;
    }

    .story-content {
        width: 900px;
        max-width: 95%;
    }

    #smallText {
        min-height: 30px;

        margin-bottom: 20px;

        font-size: 14px;

        font-weight: 700;

        letter-spacing: 6px;

        color: #5edfff;

        opacity: 0;

        transform: translateY(10px);

        transition:
            opacity 0.55s ease,
            transform 0.55s ease;
    }

    #smallText.show {
        opacity: 1;

        transform: translateY(0);
    }

    #mainText {
        min-height: 170px;

        display: flex;

        justify-content: center;
        align-items: center;

        margin: 0 auto;

        font-size: 40px;

        font-weight: 900;

        line-height: 1.45;

        letter-spacing: 1.5px;

        color: white;

        opacity: 0;

        transform: scale(0.94);

        transition:
            opacity 0.6s ease,
            transform 0.6s ease;
    }

    #mainText.show {
        opacity: 1;

        transform: scale(1);
    }

    .red {
        color: #ff647d !important;

        text-shadow:
            0 0 18px
            rgba(255,100,125,0.35);
    }

    .blue {
        color: #5ee5ff !important;

        text-shadow:
            0 0 18px
            rgba(94,229,255,0.30);
    }

    .green {
        color: #67ffad !important;

        text-shadow:
            0 0 18px
            rgba(103,255,173,0.30);
    }

    .yellow {
        color: #ffd566 !important;

        text-shadow:
            0 0 18px
            rgba(255,213,102,0.25);
    }.glitch {
            animation:
                glitchEffect
                0.16s
                linear
                3;
        }

        @keyframes glitchEffect {

            0% {
                transform:
                    translate(0)
                    scale(1);
            }

            20% {
                transform:
                    translate(-4px, 2px)
                    scale(1.01);
            }

            40% {
                transform:
                    translate(4px, -2px)
                    scale(0.99);
            }

            60% {
                transform:
                    translate(-2px, -1px)
                    scale(1.01);
            }

            80% {
                transform:
                    translate(3px, 1px)
                    scale(1);
            }

            100% {
                transform:
                    translate(0)
                    scale(1);
            }
        }

        #staticFlash {
            position: absolute;
            inset: 0;

            z-index: 15;

            pointer-events: none;

            opacity: 0;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.06),
                    rgba(255,255,255,0.06) 1px,
                    transparent 1px,
                    transparent 4px
                );

            transition: opacity 0.1s;
        }

        #staticFlash.flash {
            opacity: 1;
        }

        .bottom-hint {
            position: fixed;

            bottom: 20px;
            left: 50%;

            z-index: 30;

            transform: translateX(-50%);

            font-size: 11px;

            letter-spacing: 2px;

            color: rgba(255,255,255,0.20);
        }

        @media(max-width:650px) {

            .story-screen {
                padding: 22px;
            }

            #smallText {
                font-size: 11px;

                letter-spacing: 4px;
            }

            #mainText {
                min-height: 190px;

                font-size: 27px;

                line-height: 1.5;
            }
        }

  </style>
</head>

<body>

<div class="stars"></div>

<div class="stars-two"></div>

<div id="staticFlash"></div>


<div class="story-screen">

  <div class="story-content">

    <div id="smallText"></div>

    <div id="mainText"></div>

  </div>

</div>


<div class="vignette"></div>


<div class="bottom-hint">
  TRUST NO ONE
</div>


<script>

  const smallText =
      document.getElementById(
          "smallText"
      );


  const mainText =
      document.getElementById(
          "mainText"
      );


  const staticFlash =
      document.getElementById(
          "staticFlash"
      );


  const scenes = [

      {
          small: "UNKNOWN LOCATION",

          text:
              "You wake up in an unknown place.",

          color: "blue",

          time: 2000
      },

      {
          small: "",

          text:
              "The others are here too.",

          color: "",

          time: 1800
      },

      {
          small: "WARNING",

          text:
              "Nobody knows who to trust.",

          color: "yellow",

          time: 2200,

          static: true
      },

      {
          small: "",

          text:
              "One of you may be the killer.",

          color: "red",

          time: 2300,

          glitch: true
      },

      {
          small: "",

          text:
              "One of you may be searching for the killer.",

          color: "blue",

          time: 2400
      },

      {
          small: "",

          text:
              "Nobody knows who is lying.",

          color: "red",

          time: 2200
      },

      {
          small: "OBJECTIVE",

          text:
              "Complete your tasks.",

          color: "blue",

          time: 1800
      },{
            small: "OBJECTIVE",

            text:
                "Watch the others.",

            color: "yellow",

            time: 1800
        },

        {
            small: "OBJECTIVE",

            text:
                "Trust carefully.",

            color: "green",

            time: 1800
        },

        {
            small: "FINAL WARNING",

            text:
                "Find the truth before it is too late.",

            color: "red",

            time: 2500,

            glitch: true,

            static: true
        },

        {
            small: "",

            text:
                "THE GAME BEGINS",

            color: "green",

            time: 2200,

            glitch: true
        }

    ];


    let currentScene = 0;

    let storyFinished = false;


    function playStaticFlash() {

        staticFlash.classList.add(
            "flash"
        );


        setTimeout(
            function () {

                staticFlash.classList.remove(
                    "flash"
                );

            },
            140
        );


        setTimeout(
            function () {

                staticFlash.classList.add(
                    "flash"
                );

            },
            220
        );


        setTimeout(
            function () {

                staticFlash.classList.remove(
                    "flash"
                );

            },
            320
        );
    }


    function resetTextClasses() {

        mainText.className = "";

        smallText.className = "";
    }


    function showScene() {

        if (
            currentScene >=
            scenes.length
        ) {

            goToRoomPage();

            return;
        }


        const scene =
            scenes[currentScene];


        resetTextClasses();


        smallText.textContent =
            scene.small;


        mainText.textContent =
            scene.text;


        if (scene.color) {

            mainText.classList.add(
                scene.color
            );
        }


        void mainText.offsetWidth;


        mainText.classList.add(
            "show"
        );


        if (scene.small) {

            smallText.classList.add(
                "show"
            );
        }


        if (scene.glitch) {

            mainText.classList.add(
                "glitch"
            );
        }


        if (scene.static) {

            playStaticFlash();
        }


        setTimeout(
            function () {

                mainText.classList.remove(
                    "show"
                );


                smallText.classList.remove(
                    "show"
                );


                setTimeout(
                    function () {

                        currentScene++;

                        showScene();

                    },
                    550
                );

            },
            scene.time
        );
    }


    function goToRoomPage() {

        if (storyFinished) {

            return;
        }


        storyFinished = true;


        /*
            Story ကြည့်ပြီးပြီဆိုတာ သိမ်းထားမယ်
        */

        localStorage.setItem(
            "storySeen",
            "true"
        );


        /*
            Story ပြီးရင် Create Room page
        */

        window.location.href =
            "/play.html";
    }


    setTimeout(
        function () {

            showScene();

        },
        700
    );

</script>

</body>
</html>
