<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>Email Verification - MyGaming</title>

  <style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f3f5f9;
        font-family: Arial, sans-serif;
    }

    .container {
        width: 100%;
        max-width: 420px;
        padding: 35px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        text-align: center;
    }

    h1 {
        margin: 0 0 10px;
    }

    .subtitle {
        color: #666;
        line-height: 1.5;
    }

    #emailText {
        margin: 8px 0 25px;
        font-weight: bold;
        word-break: break-word;
    }

    #verificationCode {
        width: 100%;
        height: 58px;
        border: 2px solid #ddd;
        border-radius: 11px;
        outline: none;
        text-align: center;
        letter-spacing: 8px;
        font-size: 23px;
        font-weight: bold;
    }

    #verificationCode:focus {
        border-color: #555;
    }

    #verifyButton {
        width: 100%;
        height: 50px;
        margin-top: 18px;
        background: #222;
        color: white;
        border: none;
        border-radius: 11px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    #verifyButton:disabled {
        opacity: 0.6;
    }

    .resend {
        margin-top: 20px;
        color: #666;
        font-size: 14px;
    }

    #resendButton {
        border: none;
        background: transparent;
        font-weight: bold;
        cursor: pointer;
        text-decoration: underline;
    }

    #resendButton:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #message {
        min-height: 22px;
        margin-top: 16px;
        font-size: 14px;
        font-weight: bold;
    }

    .error {
        color: #d93025;
    }

    .success {
        color: #159447;
    }

    .login {
        display: inline-block;
        margin-top: 20px;
        color: #222;
        text-decoration: none;
        font-weight: bold;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Verify Email</h1>

  <div class="subtitle">
    Enter the 6-digit verification code sent to
  </div>

  <div id="emailText"></div>


  <input
          id="verificationCode"
          type="text"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          placeholder="000000"
  >


  <button
          id="verifyButton"
          type="button"
  >
    Verify Email
  </button>


  <div class="resend">

    Didn't receive a code?

    <button
            id="resendButton"
            type="button"
    >
      Resend
    </button>

    <span id="timer"></span>

  </div>


  <div id="message"></div>


  <a
          class="login"
          href="/login.html"
  >
    Back to Login
  </a>

</div>


<script>

  const params =
      new URLSearchParams(
          window.location.search
      );


  let email =
      params.get("email");


  if (!email) {

      email =
          sessionStorage.getItem(
              "verifyEmail"
          );
  }


  const emailText =
      document.getElementById(
          "emailText"
      );

  const codeInput =
      document.getElementById(
          "verificationCode"
      );const verifyButton =
        document.getElementById(
            "verifyButton"
        );

    const resendButton =
        document.getElementById(
            "resendButton"
        );

    const timer =
        document.getElementById(
            "timer"
        );

    const message =
        document.getElementById(
            "message"
        );


    if (email) {

        emailText.textContent =
            email;

        sessionStorage.setItem(
            "verifyEmail",
            email
        );

    } else {

        emailText.textContent =
            "Email not found";

        showError(
            "Please sign up again."
        );

        verifyButton.disabled = true;
        resendButton.disabled = true;
    }


    codeInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value.replace(
                    /\D/g,
                    ""
                );

            if (this.value.length > 6) {

                this.value =
                    this.value.substring(
                        0,
                        6
                    );
            }

            clearMessage();
        }
    );


    codeInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {
                verifyEmail();
            }
        }
    );


    verifyButton.addEventListener(
        "click",
        verifyEmail
    );


    async function verifyEmail() {

        clearMessage();

        const code =
            codeInput.value.trim();


        if (!email) {

            showError(
                "Email not found."
            );

            return;
        }


        if (code.length !== 6) {

            showError(
                "Please enter the 6-digit verification code."
            );

            return;
        }


        verifyButton.disabled = true;
        verifyButton.textContent =
            "Verifying...";


        try {

            const response =
                await fetch(
                    "/api/auth/verify",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "same-origin",

                        body: JSON.stringify({
                            email: email,
                            code: code
                        })
                    }
                );


            const responseText =
                await response.text();


            let data = {};

            try {
                data = JSON.parse(responseText);
            } catch (e) {
                console.error(
                    responseText
                );
            }


            if (!response.ok) {

                showError(
                    data.message ||
                    "Verification failed."
                );

                return;
            }


            if (data.success === true) {

                showSuccess(
                    data.message ||
                    "Email verified successfully."
                );


                sessionStorage.removeItem(
                    "verifyEmail"
                );


                setTimeout(
                    function () {

                        window.location.replace(
                            "/login.html"
                        );

                    },
                    1000
                );

            } else {

                showError(
                    data.message ||
                    "Invalid verification code."
                );
            }


        } catch (error) {

            console.error(error);

            showError(
                "Cannot connect to the server."
            );

        } finally {

            verifyButton.disabled = false;

            verifyButton.textContent =
                "Verify Email";
        }
    }resendButton.addEventListener(
        "click",
        resendCode
    );


    async function resendCode() {

        clearMessage();


        if (!email) {

            showError(
                "Email not found."
            );

            return;
        }


        resendButton.disabled = true;


        try {

            const response =
                await fetch(
                    "/api/auth/resend",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "same-origin",

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );


            const responseText =
                await response.text();


            let data = {};

            try {
                data =
                    JSON.parse(
                        responseText
                    );
            } catch (e) {
                console.error(
                    responseText
                );
            }


            if (!response.ok) {

                showError(
                    data.message ||
                    "Could not resend verification code."
                );

                resendButton.disabled = false;

                return;
            }


            if (data.success === true) {

                showSuccess(
                    data.message ||
                    "New verification code sent."
                );

                startTimer();

            } else {

                showError(
                    data.message ||
                    "Could not resend code."
                );

                resendButton.disabled = false;
            }


        } catch (error) {

            console.error(error);

            showError(
                "Cannot connect to the server."
            );

            resendButton.disabled = false;
        }
    }


    function startTimer() {

        let seconds = 30;

        resendButton.disabled = true;

        timer.textContent =
            " (" + seconds + "s)";


        const countdown =
            setInterval(
                function () {

                    seconds--;

                    timer.textContent =
                        " (" + seconds + "s)";


                    if (seconds <= 0) {

                        clearInterval(
                            countdown
                        );

                        timer.textContent = "";

                        resendButton.disabled = false;
                    }

                },
                1000
            );
    }


    function showError(text) {

        message.textContent = text;
        message.className = "error";
    }


    function showSuccess(text) {

        message.textContent = text;
        message.className = "success";
    }


    function clearMessage() {

        message.textContent = "";
        message.className = "";
    }

</script>

</body>
</html>
