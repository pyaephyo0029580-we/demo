<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Tap</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        color: white;

        background:
            radial-gradient(circle at center, #173b78, transparent 35%),
            linear-gradient(135deg, #030817, #101d49);
    }

    .game {
        width: 650px;
        max-width: 95%;

        padding: 30px;

        border-radius: 24px;

        background: #081a45;

        border: 2px solid #37d2ff;

        box-shadow:
            0 0 30px rgba(55, 210, 255, 0.25);
    }

    .top {
        text-align: center;
    }

    h1 {
        margin-top: 0;
    }

    .info {
        display: flex;
        justify-content: space-between;

        margin: 20px 0;

        padding: 12px 15px;

        border-radius: 10px;

        background: rgba(255,255,255,0.07);
    }

    #arena {
        position: relative;

        width: 100%;
        height: 420px;

        overflow: hidden;

        border-radius: 18px;

        background:
            radial-gradient(circle at 30% 30%, #214a96, #06142f 70%);
    }

    .crystal {
        position: absolute;

        width: 75px;
        height: 75px;

        border: none;

        cursor: pointer;

        background: transparent;

        font-size: 58px;

        filter:
            drop-shadow(0 0 14px #6ae5ff);

        animation:
            pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
        from {
            transform: scale(1);
        }

        to {
            transform: scale(1.12);
        }
    }

    #message {
        min-height: 32px;

        margin-top: 18px;

        text-align: center;

        font-size: 22px;
        font-weight: bold;
    }

    .good {
        color: #67ffae;
    }

    .bad {
        color: #ff7b7b;
    }

    .complete {
        color: #67ffae;

        font-size: 28px;
    }
  </style>
</head>

<body>

<div class="game">

  <div class="top">

    <h1>
      💎 Crystal Tap
    </h1>

    <p>
      Tap the crystal before it disappears.
      Get 5 correct hits.
    </p>

  </div>


  <div class="info">

    <div>
      Hits:
      <span id="hits">0</span>/5
    </div>

    <div>
      Misses:
      <span id="misses">0</span>
    </div>

  </div>


  <div id="arena"></div>


  <div id="message"></div>

</div>


<script>

  const TOTAL_HITS = 5;

  const arena =
      document.getElementById("arena");

  const hitsText =
      document.getElementById("hits");

  const missesText =
      document.getElementById("misses");

  const message =
      document.getElementById("message");


  let hits = 0;

  let misses = 0;

  let currentCrystal = null;

  let crystalTimer = null;

  let complete = false;


  function random(min, max) {

      return Math.floor(
          Math.random() *
          (max - min + 1)
      ) + min;
  }


  function showCrystal() {

      if (complete) {
          return;
      }


      if (currentCrystal) {

          currentCrystal.remove();

          currentCrystal = null;
      }


      const crystal =
          document.createElement("button");


      crystal.type =
          "button";


      crystal.className =
          "crystal";const symbols = [
            "💎",
            "🔷",
            "🔹",
            "🟣",
            "✨"
        ];


        crystal.textContent =
            symbols[
                random(
                    0,
                    symbols.length - 1
                )
            ];


        const maxX =
            arena.clientWidth - 80;

        const maxY =
            arena.clientHeight - 80;


        crystal.style.left =
            random(0, maxX) + "px";


        crystal.style.top =
            random(0, maxY) + "px";


        crystal.addEventListener(
            "click",
            function () {

                clearTimeout(
                    crystalTimer
                );


                hits++;


                hitsText.textContent =
                    hits;


                message.textContent =
                    "✓ Good hit!";


                message.className =
                    "good";


                crystal.remove();


                currentCrystal =
                    null;


                if (
                    hits >= TOTAL_HITS
                ) {

                    complete =
                        true;


                    message.textContent =
                        "✓ TASK COMPLETE";


                    message.className =
                        "complete";


                    return;
                }


                setTimeout(
                    showCrystal,
                    300
                );

            }
        );


        arena.appendChild(
            crystal
        );


        currentCrystal =
            crystal;


        crystalTimer =
            setTimeout(
                function () {

                    if (
                        currentCrystal
                    ) {

                        currentCrystal.remove();

                        currentCrystal =
                            null;


                        misses++;


                        missesText.textContent =
                            misses;


                        message.textContent =
                            "Missed!";


                        message.className =
                            "bad";


                        setTimeout(
                            showCrystal,
                            300
                        );
                    }

                },
                1200
            );
    }


    showCrystal();

</script>

</body>
</html>
