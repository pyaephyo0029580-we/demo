<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tiled Map Game</title>

    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #game-container {
            padding: 20px;
        }

        #game-canvas {
            display: block;
            margin: 20px auto;
            background-color: #222;
            border: 2px solid #555;
            max-width: 95vw;
        }
    </style>
</head>

<body>

<div id="game-container">
    <h1>Tiled Map Game Room</h1>

    <p>
        Room Code:
        <span id="room-display">Loading...</span>
    </p>

    <canvas id="game-canvas" width="800" height="600"></canvas>

    <p id="game-status">Game page loaded. Waiting for map...</p>
</div>

<script>
    // Get room code from URL
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get("room");

    const roomDisplay = document.getElementById("room-display");
    const gameStatus = document.getElementById("game-status");
    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");

    if (roomCode) {
        roomDisplay.textContent = roomCode;
        console.log("Room Code:", roomCode);
    } else {
        roomDisplay.textContent = "No Room Provided!";
    }

    // Temporary test background
    // This does NOT load the actual Tiled map yet.
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#fff";
    ctx.font = "20px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
        "Waiting for Tiled Map...",
        canvas.width / 2,
        canvas.height / 2
    );

    gameStatus.textContent =
        "HTML game page is working. Tiled map is not connected yet.";
</script>

</body>
</html>
