<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency Match</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #040817, #142456);
        }

        .game {
            width: 650px;
            max-width: 95%;
            padding: 30px;
            border-radius: 24px;
            border: 2px solid #38d7ff;
            background: #081a43;
            text-align: center;
            box-shadow: 0 0 30px rgba(56,215,255,0.25);
        }

        .wave-box {
            height: 140px;
            margin: 25px 0;
            border-radius: 15px;
            background: #102f67;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        input[type="range"] {
            width: 100%;
        }

        #percent {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #6deaff;
        }

        .progress {
            height: 12px;
            margin-top: 15px;
            border-radius: 20px;
            background: rgba(255,255,255,0.12);
            overflow: hidden;
        }

        #fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2dd9ff, #65ffae);
            transition: width 0.2s;
        }

        #message {
            min-height: 32px;
            margin-top: 18px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>📶 Frequency Match</h1>

    <p>
        Adjust the frequency until your wave matches the target wave.
    </p>

    <div class="wave-box">
        <canvas id="canvas"></canvas>
    </div>

    <input
            type="range"
            id="frequency"
            min="1"
            max="100"
            value="20"
    >

    <div>
        Frequency:
        <span id="value">20</span>
    </div>

    <div id="percent">
        Match: 0%
    </div>

    <div class="progress">
        <div id="fill"></div>
    </div>

    <div id="message"></div>

</div>

<script>

    const slider =
        document.getElementById("frequency");

    const valueText =
        document.getElementById("value");

    const percentText =
        document.getElementById("percent");

    const fill =
        document.getElementById("fill");

    const message =
        document.getElementById("message");

    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");

    const targetFrequency = 73;


    function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }


    function drawWave(userFrequency) {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const center =
            canvas.height / 2;


        /*
            TARGET WAVE
        */

        ctx.beginPath();

        ctx.strokeStyle =
            "#65ffae";

        ctx.lineWidth =
            3;

        for (
            let x = 0;
            x < canvas.width;
            x++
        ) {

            const y =
                center
                +
                Math.sin(
                    x *
                    targetFrequency *
                    0.0015
                )
                *
                35;

            if (x === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }

        ctx.stroke();


        /*
            PLAYER WAVE
        */

        ctx.beginPath();

        ctx.strokeStyle =
            "#5adfff";

        ctx.lineWidth =
            3;

        for (
            let x = 0;
            x < canvas.width;
            x++
        ) {

            const y =
                center
                +
                Math.sin(
                    x *
                    userFrequency *
                    0.0015
                )
                *
                35;

            if (x === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }

        ctx.stroke();
    }


    function update() {

        const value =
            Number(slider.value);valueText.textContent =
        value;

    const difference =
        Math.abs(
            targetFrequency -
            value
        );

    let percent =
        100 -
        difference * 2;

    percent =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        );

    percent =
        Math.round(percent);

    percentText.textContent =
        "Match: " +
        percent +
        "%";

    fill.style.width =
        percent +
        "%";

    drawWave(value);


    if (percent >= 98) {

        message.textContent =
            "✓ TASK COMPLETE";

        message.style.color =
            "#65ffae";

    } else {

        message.textContent =
            "Keep tuning...";

        message.style.color =
            "#ffd56b";
    }
}


window.addEventListener(
    "resize",
    function () {

        resizeCanvas();
        update();
    }
);


slider.addEventListener(
    "input",
    update
);


resizeCanvas();
update();

</script>

</body>
</html>
