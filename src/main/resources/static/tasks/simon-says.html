<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Says</title>

  <style>
    *{
        box-sizing:border-box;
    }

    body{
        margin:0;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:Arial,sans-serif;
        color:white;
        background:linear-gradient(135deg,#040817,#142456);
    }

    .game{
        width:620px;
        max-width:95%;
        padding:30px;
        border:2px solid #3bd7ff;
        border-radius:24px;
        background:#081a43;
        text-align:center;
    }

    #command{
        min-height:100px;
        margin:30px 0;
        padding:25px;
        display:flex;
        justify-content:center;
        align-items:center;
        border-radius:18px;
        background:#102f67;
        color:#67eaff;
        font-size:30px;
        font-weight:bold;
    }

    .controls{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .controls button{
        height:60px;
        border:none;
        border-radius:13px;
        background:#193d79;
        color:white;
        font-size:17px;
        font-weight:bold;
        cursor:pointer;
    }

    .controls button:hover{
        background:#2859a5;
    }

    .wait{
        grid-column:1/3;
        background:#7b5820 !important;
    }

    #message{
        min-height:35px;
        margin-top:20px;
        font-size:22px;
        font-weight:bold;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>🧠 Simon Says</h1>

  <p>
    Only follow the command if it starts with
    <strong>"SIMON SAYS"</strong>.
    Otherwise press WAIT.
  </p>

  <div>
    Correct:
    <span id="score">0</span>/5
  </div>

  <div id="command"></div>

  <div class="controls">

    <button data-action="LEFT">
      ← LEFT
    </button>

    <button data-action="RIGHT">
      RIGHT →
    </button>

    <button data-action="JUMP">
      ⬆ JUMP
    </button>

    <button data-action="DUCK">
      ⬇ DUCK
    </button>

    <button
            class="wait"
            data-action="WAIT"
    >
      WAIT
    </button>

  </div>

  <div id="message"></div>

</div>

<script>

  const actions =
      ["LEFT","RIGHT","JUMP","DUCK"];

  const commandText =
      document.getElementById("command");

  const scoreText =
      document.getElementById("score");

  const message =
      document.getElementById("message");

  const buttons =
      document.querySelectorAll(
          "[data-action]"
      );

  let correctAction = "";
  let simonCommand = false;
  let score = 0;
  let complete = false;


  function newCommand(){

      if(complete) return;


      correctAction =
          actions[
              Math.floor(
                  Math.random()*actions.length
              )
          ];


      simonCommand =
          Math.random() < 0.65;


      if(simonCommand){

          commandText.textContent =
              "SIMON SAYS: " +
              correctAction;

          commandText.style.color =
              "#65ffae";

      }else{

          commandText.textContent =
              correctAction;

          commandText.style.color =
              "#ffcf65";
      }


      message.textContent =
          "";
  }


  function choose(action){

      if(complete) return;


      let correct = false;


      if(simonCommand){

          correct =
              action === correctAction;

      }else{

          correct =
              action === "WAIT";
      }


      if(correct){

          score++;

          scoreText.textContent =
              score;

          message.textContent =
              "✓ Correct";

          message.style.color =
              "#65ffae";


          if(score >= 5){

              complete = true;

              commandText.textContent =
                  "COMPLETE";

              message.textContent =
                  "✓ TASK COMPLETE";

              buttons.forEach(
                  b=>b.disabled=true
              );

              return;
          }


          setTimeout(
              newCommand,
              550
          );

      }else{

          score =
              Math.max(
                  0,
                  score-1
              );

          scoreText.textContent =
              score;

          message.textContent =
              "✕ Wrong action";

          message.style.color =
              "#ff7272";


          setTimeout(
              newCommand,
              700
          );
      }
  }


  buttons.forEach(button=>{button.addEventListener(
        "click",
        ()=>choose(
            button.dataset.action
        )
    );

});


newCommand();

</script>

</body>
</html>
