<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Multiplayer Calculator & Among Us Voting</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #0d1117; color: #c9d1d9; }
        .calculator-box { display: inline-block; padding: 20px; border: 1px solid #30363d; border-radius: 8px; background: #161b22; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 360px; text-align: left; margin-bottom: 20px; }
        input, select, button { padding: 8px; margin: 5px 0; font-size: 15px; box-sizing: border-box; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; }
        .calculator-box input, .calculator-box select { width: 100%; }
        #result { font-weight: bold; color: #58a6ff; }
        .user-count { background: #21262d; padding: 5px 10px; border-radius: 4px; display: inline-block; margin-bottom: 15px; font-weight: bold; color: #3fb950; text-align: center; width: 100%; box-sizing: border-box; border: 1px solid #30363d; }

        /* Floating Toggle Button */
        .chat-container { position: fixed; bottom: 25px; right: 25px; z-index: 9999; text-align: left; }
        #toggle-chat-btn { background-color: #238636; color: white; border: none; padding: 12px 20px; border-radius: 30px; cursor: pointer; font-size: 15px; font-weight: bold; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
        #toggle-chat-btn:hover { background-color: #2ea043; }

        /* Main Hub Box */
        .hub-box { width: 780px; height: 520px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); margin-bottom: 12px; overflow: hidden; position: fixed; bottom: 80px; right: 25px; }
        .hub-header { background: #21262d; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; border-bottom: 1px solid #30363d; color: #f0f6fc; font-size: 16px; }
        .hub-close-btn { background: transparent; border: none; color: #8b949e; font-size: 18px; cursor: pointer; }
        .hub-close-btn:hover { color: #f0f6fc; }

        .hub-body { display: flex; flex: 1; height: calc(100% - 50px); overflow: hidden; }

        /* Left Side: Among Us Style Voting Grid */
        .voting-section { flex: 1.3; padding: 15px; display: flex; flex-direction: column; border-right: 1px solid #30363d; background: #0d1117; overflow-y: auto; }
        .timer-badge { background: #21262d; border: 1px solid #30363d; color: #ffc107; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 13px; text-align: center; margin-bottom: 10px; }
        .voting-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .player-card { background: #21262d; border: 2px solid #30363d; border-radius: 8px; padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; opacity: 0.6; }
        .player-card.active-voting { opacity: 1; border-color: #58a6ff; }
        .player-card.active-voting:hover { background: #30363d; }
        .player-card.selected { border-color: #f85149; background: #481a1d; opacity: 1; }
        .player-info { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #c9d1d9; }
        .player-avatar { width: 32px; height: 32px; background: #30363d; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        /* Right Side: Beside Chat Bar */
        .chat-section { flex: 1; padding: 15px; display: flex; flex-direction: column; background: #161b22; height: 100%; box-sizing: border-box; }
        .chat-messages { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; text-align: left; }
        .chat-message-item { background: #21262d; padding: 6px 10px; border-radius: 6px; border: 1px solid #30363d; word-break: break-word; }
        .chat-sender { font-weight: bold; color: #58a6ff; margin-right: 5px; }

        .chat-input-area { display: flex; gap: 5px; }
        .chat-input-area input { flex: 1; margin: 0; padding: 8px; font-size: 13px; }
        .chat-input-area button { margin: 0; padding: 8px 14px; background: #238636; color: white; border: none; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background: #2ea043; }
    </style>
</head>
<body>

<div class="calculator-box">
    <h2 style="text-align: center; margin-top: 0; color: #f0f6fc;">Multiplayer Mini Calculator</h2>
    <div>
        <span class="user-count">🟢 Online ရှိနေသူ: <span id="activeUsers">0</span> ယောက်</span>
    </div>
    <div>
        <label style="font-size: 13px; font-weight: bold;">သင့်နာမည် (Name):</label>
        <input type="text" id="sender" placeholder="သင့်နာမည်" value="User" oninput="notifyJoin()">
    </div>
    <div style="display: flex; gap: 5px; align-items: center; margin-top: 5px;">
        <input type="number" id="num1" placeholder="Num 1">
        <select id="operator" style="width: auto;">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input type="number" id="num2" placeholder="Num 2">
    </div>
    <button onclick="sendCalculation()" style="width: 100%; margin-top: 10px; background: #238636; color: white; font-weight: bold; cursor: pointer;">Calculate</button>
    <h3 style="margin-bottom: 0; font-size: 15px;">ရလဒ်: <span id="result">ဘာမှမရှိသေးပါ</span></h3>
</div>

<div class="chat-container">
    <button id="toggle-chat-btn" onclick="toggleHubPopup()">💬 Who Is The Impostor? (Voting & Chat)</button>

    <div id="hub-box" class="hub-box" style="display: none;">
        <div class="hub-header">
            <span>🚨 Who Is The Impostor? (Voting & Chat Hub)</span>
            <button class="hub-close-btn" onclick="toggleHubPopup()">✕</button>
        </div>

        <div class="hub-body">
            <!-- Left Side: Among Us Style Voting Grid -->
            <div class="voting-section">
                <div id="timer-display" class="timer-badge">💬 ဆွေးနွေးချိန် (Discussion): 30s</div>
                <div style="font-size: 12px; font-weight: bold; color: #8b949e; text-align: left; margin-bottom: 5px;">သံသယရှိသူများ (မဲပေးချိန်ရောက်မှ နှိပ်၍ရမည်):</div>
                <div id="voters-grid" class="voting-grid">
                    <!-- Dynamic user cards -->
                </div>
                <div id="vote-results" style="margin-top: 10px; background: #21262d; padding: 8px; border-radius: 6px; font-size: 12px; text-align: left; border: 1px solid #30363d;">
                    <strong>📊 မဲရလဒ်များ:</strong> <span id="result-text">မဲမရှိသေးပါ</span>
                </div>
            </div>

            <!-- Right Side: Beside Chat Bar -->
            <div class="chat-section">
                <div style="font-size: 13px; font-weight: bold; color: #8b949e; text-align: left; margin-bottom: 5px;">Group Chat:</div>
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="စာရိုက်ရန်..." onkeypress="handleChatKey(event)">
                    <button onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let stompClient = null;
    let onlineUsersList = [];
    let myVotedTarget = null;

    let votingActive = false;

    function connect() {
        let socket = new SockJS('/game-websocket');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);

            stompClient.subscribe('/topic/calculator', function (message) {
                let response = JSON.parse(message.body);
                let displayText = response.sender + " တွက်လိုက်သည်: " + response.num1 + " " + response.operator + " " + response.num2 + " = " + response.result;
                document.getElementById('result').innerText = displayText;
            });

            stompClient.subscribe('/topic/users', function (message) {
                document.getElementById('activeUsers').innerText = message.body;
            });

            stompClient.subscribe('/topic/chat', function (message) {
                let chatData = JSON.parse(message.body);
                appendChatMessage(chatData.sender, chatData.message);
            });

            stompClient.subscribe('/topic/votes', function (message) {
                let voteData = JSON.parse(message.body);
                updateVoteDisplay(voteData);
            });

            stompClient.subscribe('/topic/userlist', function (message) {
                onlineUsersList = JSON.parse(message.body);
                document.getElementById('activeUsers').innerText = onlineUsersList.length;
                renderVoterGrid();
            });

            // Server ဘက်မှ အချိန်တူညီစွာ ညှိပေးရန် Timer Sync topic ကို လက်ခံခြင်း
            stompClient.subscribe('/topic/timer', function (message) {
                let timerData = JSON.parse(message.body);
                syncTimerWithServer(timerData.phase, timerData.timeLeft);
            });

            notifyJoin();
        });
    }

    function notifyJoin() {
        let sender = document.getElementById('sender').value || "Anonymous";
        if(stompClient && stompClient.connected) {
            stompClient.send("/app/join", {}, JSON.stringify({ voter: sender }));
        }
    }

    function sendCalculation() {
        let sender = document.getElementById('sender').value || "Anonymous";
        let num1 = document.getElementById('num1').value;
        let num2 = document.getElementById('num2').value;
        let operator = document.getElementById('operator').value;

        stompClient.send("/app/calculate", {}, JSON.stringify({
            sender: sender, num1: parseFloat(num1), num2: parseFloat(num2), operator: operator
        }));
    }

    function toggleHubPopup() {
        let hubBox = document.getElementById('hub-box');
        let isOpening = hubBox.style.display === 'none';
        hubBox.style.display = isOpening ? 'flex' : 'none';

        if (isOpening) {
            document.getElementById('chat-input').focus();
            notifyJoin();

            // Server ဆီသို့ Timer အခြေအနေ တောင်းဆိုခြင်း
            if (stompClient && stompClient.connected) {
                stompClient.send("/app/request-timer", {}, {});
            }
        }
    }

    // Server မှ ပေးပို့လာသော Real-time အချိန်အတိုင်း Device အားလုံးကို တူညီစေခြင်း
    function syncTimerWithServer(phase, timeLeft) {
        let timerDisplay = document.getElementById('timer-display');

        if (phase === 'discussion') {
            votingActive = false;
            timerDisplay.innerText = `💬 ဆွေးနွေးချိန် (Discussion): ${timeLeft}s`;
        } else if (phase === 'voting') {
            votingActive = true;
            timerDisplay.innerText = `🗳️ မဲပေးချိန် (Voting Active): ${timeLeft}s`;
        } else {
            votingActive = false;
            timerDisplay.innerText = `🔒 မဲပေးချိန် ပြီးဆုံးပါပြီ (Voting Ended)`;
        }
        renderVoterGrid();
    }

    function castVote(targetUser) {
        if (!votingActive) {
            alert("ယခုလက်ရှိ ဆွေးနွေးချိန် (Discussion) ဖြစ်နေပါသေးသည် မဲပေး၍မရသေးပါ။");
            return;
        }

        let sender = document.getElementById('sender').value || "Anonymous";
        if (sender === targetUser) {
            alert("သင့်ကိုယ်သင် မဲပေးခွင့်မရှိပါ။");
            return;
        }

        myVotedTarget = targetUser;
        stompClient.send("/app/vote", {}, JSON.stringify({ voter: sender, target: targetUser }));
        renderVoterGrid();
    }

    function renderVoterGrid() {
        let container = document.getElementById('voters-grid');
        container.innerHTML = "";
        let currentUserName = document.getElementById('sender').value || "Anonymous";

        if (!onlineUsersList || onlineUsersList.length === 0) {
            container.innerHTML = `<p style="color: #8b949e; font-size: 12px; grid-column: span 2;">Active players loading...</p>`;
            return;
        }

        onlineUsersList.forEach(user => {
            let card = document.createElement('div');
            let isSelected = (myVotedTarget === user);
            let activeClass = votingActive ? 'active-voting' : '';
            card.className = `player-card ${activeClass} ${isSelected ? 'selected' : ''}`;

            let displayName = user === currentUserName ? `${escapeHtml(user)} (ME)` : escapeHtml(user);

            card.innerHTML = `
                <div class="player-info">
                    <div class="player-avatar">👤</div>
                    <span>${displayName}</span>
                </div>
            `;

            if (user !== currentUserName) {
                card.onclick = () => {
                    if (votingActive) {
                        castVote(user);
                    } else {
                        alert("ဆွေးနွေးချိန် မကုန်သေးပါ၊ ခဏစောင့်ပါ။");
                    }
                };
            }
            container.appendChild(card);
        });
    }

    function updateVoteDisplay(data) {
        let textDiv = document.getElementById('result-text');
        let html = "";
        let maxVotes = -1;
        let ejected = "မရှိသေးပါ";

        for (let target in data.voteCounts) {
            html += `${target}: ${data.voteCounts[target]} | `;
            if (data.voteCounts[target] > maxVotes) {
                maxVotes = data.voteCounts[target];
                ejected = target;
            }
        }
        if (html === "") html = "မဲမရှိသေးပါ";
        else html += `<br><span style="color: #ff7b72;">Max Suspect: ${ejected} (${maxVotes} votes)</span>`;
        textDiv.innerHTML = html;
    }

    function sendChatMessage() {
        let input = document.getElementById('chat-input');
        let messageText = input.value.trim();
        let sender = document.getElementById('sender').value || "Anonymous";
        if (messageText && stompClient) {
            stompClient.send("/app/chat", {}, JSON.stringify({ sender: sender, message: messageText }));
            input.value = '';
        }
    }

    function handleChatKey(event) { if (event.key === 'Enter') { sendChatMessage(); } }

    function appendChatMessage(sender, message) {
        let messagesContainer = document.getElementById('chat-messages');
        let messageElement = document.createElement('div');
        messageElement.className = 'chat-message-item';
        messageElement.innerHTML = `<span class="chat-sender">${escapeHtml(sender)}:</span> <span class="chat-text">${escapeHtml(message)}</span>`;
        messagesContainer.appendChild(messageElement);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(text) {
        let map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text ? text.replace(/[&<>"']/g, function(m) { return map[m]; }) : '';
    }

    window.onload = connect;
</script>
</body>
</html>
