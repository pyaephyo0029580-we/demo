<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Online Game - Home Page</title>
    <style>
        body {
            background-color: #101722;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 1000px;
            height: 650px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Top Right Coin Badge */
        .coin-box {
            position: absolute;
            top: 25px;
            right: 35px;
            background-color: #17243a;
            border: 2px solid #40536d;
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .coin-dot {
            color: #ffc107;
            font-size: 22px;
            font-weight: bold;
        }
        #coinLabel {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        /* Main Content VBox */
        .main-vbox {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        h1 {
            color: white;
            font-size: 35px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .btn {
            width: 240px;
            height: 130px;
            border-radius: 18px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            text-align: center;
            user-select: none;
        }
        .btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        /* Button Colors */
        .btn-play { background-color: #063d2b; border: 3px solid #00e676; color: white; font-size: 24px; }
        .btn-inventory { background-color: #092b59; border: 3px solid #168cff; color: white; font-size: 21px; }
        .btn-shop { background-color: #503900; border: 3px solid #ffc107; color: white; font-size: 24px; }
        .btn-account { background-color: #32125d; border: 3px solid #8e4cff; color: white; font-size: 21px; }
        .btn-setting { background-color: #263445; border: 3px solid #73869d; color: white; font-size: 22px; }
        .btn-friends { background-color: #541919; border: 3px solid #ff4545; color: white; font-size: 22px; }
    </style>
</head>
<body>

<div class="container">
    <!-- COIN -->
    <div class="coin-box">
        <span class="coin-dot">●</span>
        <span id="coinLabel">0</span>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-vbox">
        <h1>GAME</h1>
        <div class="grid">
            <div class="btn btn-play" onclick="location.href='play.html'">PLAY</div>
            <div class="btn btn-inventory" onclick="alert('INVENTORY page will open here.')">INVENTORY</div>
            <div class="btn btn-shop" onclick="alert('SHOP page will open here.')">SHOP</div>
            <div class="btn btn-account" onclick="openAccountModal()">MY ACCOUNT</div>
            <div class="btn btn-setting" onclick="alert('SETTING page will open here.')">SETTING</div>
            <div class="btn btn-friends" onclick="alert('FRIENDS page will open here.')">FRIENDS</div>
        </div>
    </div>
</div>

<script>
    let currentUserEmail = "";

    // ဖွင့်လိုက်တာနဲ့ Server ကနေ Data (Coin နဲ့ Email) လှမ်းယူမည်
    window.onload = function() {
        fetch('/api/homepage/data')
            .then(response => response.json())
            .then(data => {
                document.getElementById('coinLabel').innerText = data.coins;
                currentUserEmail = data.email;
            })
            .catch(error => console.error('Error loading homepage data:', error));
    };

    function openAccountModal() {
        alert("My Account Email: " + currentUserEmail);
    }
</script>

</body>
</html>
