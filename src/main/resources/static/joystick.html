<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Play Area</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }
        /* Unity Game Canvas ကို screen အပြည့်ထားရန် */
        #unity-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ⚙️ Settings Button (ညာဘက်အပေါ်ထောင့်) */
        #inGameSettingsBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 999;
            background: #21262d;
            color: white;
            border: 2px solid #30363d;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Virtual Joystick Container (ဘယ်ဘက်အောက်ခြမ်း) */
        #joystickZone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 140px;
            height: 140px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        /* Settings Modal Overlay */
        #gameSettingsModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<!-- Unity WebGL Game Container (သင့်ရဲ့ Unity Build ဝင်မည့်နေရာ) -->
<div id="unity-container">
    <!-- Unity Canvas က ဒီထဲမှာ အလုပ်လုပ်ပါမယ် -->
</div>

<!-- ===================================== -->
<!-- 1. SETTINGS BUTTON -->
<!-- ===================================== -->
<button id="inGameSettingsBtn" onclick="openGameSettings()">
    ⚙️ Settings
</button>

<!-- ===================================== -->
<!-- 2. VIRTUAL JOYSTICK AREA -->
<!-- ===================================== -->
<div id="joystickZone">
    Joystick
</div>

<!-- ===================================== -->
<!-- 3. SETTINGS MODAL (Joystick On/Off & Leave) -->
<!-- ===================================== -->
<div id="gameSettingsModal">
    <div style="background: #161b22; border: 2px solid #30363d; border-radius: 16px; width: 350px; padding: 25px; color: white; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
        <h2 style="margin-top: 0; font-size: 20px; border-bottom: 1px solid #30363d; padding-bottom: 10px; text-align: center;">Game Settings</h2>

        <!-- Joystick Toggle -->
        <div style="margin: 20px 0; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 15px; font-weight: bold;">Virtual Joystick</span>
            <input type="checkbox" id="joystickToggle" checked onchange="toggleJoystick(this)" style="width: 20px; height: 20px; cursor: pointer;">
        </div>

        <!-- Leave Game Button -->
        <button onclick="leaveGame()" style="width: 100%; padding: 12px; background-color: #d95569; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;">
            🚪 Leave Game
        </button>

        <!-- Close Button -->
        <button onclick="closeGameSettings()" style="width: 100%; padding: 10px; background-color: #30363d; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;">
            Close
        </button>
    </div>
</div>

<script>
    function openGameSettings() {
        document.getElementById('gameSettingsModal').style.display = 'flex';
    }

    function closeGameSettings() {
        document.getElementById('gameSettingsModal').style.display = 'none';
    }

    function toggleJoystick(checkbox) {
        var joystickZone = document.getElementById('joystickZone');
        if (checkbox.checked) {
            joystickZone.style.display = 'flex';
        } else {
            joystickZone.style.display = 'none';
        }
    }

    function leaveGame() {
        var username = sessionStorage.getItem("username") || "Player";
        window.location.href = `/homepage.html?user=` + encodeURIComponent(username);
    }
</script>
</body>
</html>
