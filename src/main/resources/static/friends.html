<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Friends</title>

  <style>

    * {
        box-sizing: border-box;
    }

    body {

        margin: 0;

        min-height: 100vh;

        font-family:
            Arial,
            sans-serif;

        color: white;

        background:
            radial-gradient(
                circle at top,
                #283052,
                #111426
            );
    }

    .page {

        width: 720px;

        max-width: 94%;

        margin: auto;

        padding:
            30px
            0
            60px;
    }

    h1 {

        text-align: center;

        font-size: 40px;
    }

    .back-button {

        position: absolute;

        top: 25px;

        left: 25px;

        width: 45px;

        height: 45px;

        border: none;

        border-radius: 8px;

        background: #283552;

        color: white;

        cursor: pointer;

        font-size: 24px;
    }

    .player-box {

        text-align: center;

        margin-bottom: 30px;

        padding: 25px;
    }

    .small-label {

        color: #87aaff;

        font-size: 13px;

        font-weight: bold;
    }

    #playerId {

        margin-top: 8px;

        color: #3baaff;

        font-size: 28px;

        font-weight: bold;
    }

    .hint {

        margin-top: 7px;

        color: #b0bad3;

        font-size: 13px;
    }

    .card {

        margin-bottom: 20px;

        padding: 23px;

        border:
            1px solid
            #526b9d;

        border-radius: 15px;

        background:
            rgba(
                35,
                44,
                79,
                0.92
            );
    }

    h2 {

        margin-top: 0;

        font-size: 25px;
    }

    label {

        display: block;

        margin-bottom: 8px;

        color: #c6d3ef;
    }

    .search-row {

        display: flex;

        gap: 10px;
    }

    #searchInput {

        flex: 1;

        height: 50px;

        padding:
            0
            15px;

        border: none;

        border-radius: 9px;

        font-size: 16px;
    }

    button {

        cursor: pointer;
    }

    .search-button {

        width: 120px;

        border: none;

        border-radius: 9px;

        background: #3788ef;

        color: white;

        font-weight: bold;
    }

    #foundPlayer {

        display: none;

        margin-top: 15px;

        padding: 15px;

        border-radius: 9px;

        background: #141b32;
    }

    #foundName {

        font-size: 18px;

        font-weight: bold;
    }

    #foundId {

        margin-top: 5px;

        color: #59b8ff;
    }

    #sendButton {

        display: block;

        width: 245px;

        height: 45px;

        margin:
            16px
            auto
            0;

        border: none;

        border-radius: 9px;

        background:
            linear-gradient(
                90deg,
                #45d89c,
                #5de9b5
            );

        color: white;

        font-weight: bold;
    }

    #sendButton:disabled {

        opacity: 0.4;

        cursor: not-allowed;
    }

    #searchMessage {

        min-height: 25px;

        margin-top: 12px;

        text-align: center;

        font-weight: bold;
    }

    .success {

        color: #69efab;
    }.error {

            color: #ff8195;
        }

        .title-row {

            display: flex;

            align-items: center;

            justify-content:
                space-between;
        }

        .refresh-button {

            height: 37px;

            padding:
                0
                17px;

            border: none;

            border-radius: 7px;

            background: #8396bd;

            color: white;

            font-weight: bold;
        }

        .empty {

            padding: 24px;

            border-radius: 9px;

            background: #151b30;

            color: #b7c2da;

            text-align: center;
        }

        .request-item,
        .friend-item {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 10px;

            padding: 15px;

            border-radius: 9px;

            background: #151b30;
        }

        .person-data {

            flex: 1;
        }

        .person-name {

            font-size: 18px;

            font-weight: bold;
        }

        .person-id {

            margin-top: 4px;

            color: #5bbaff;

            font-size: 13px;
        }

        .accept-button {

            padding:
                9px
                14px;

            border: none;

            border-radius: 7px;

            background: #32c78b;

            color: white;

            font-weight: bold;
        }

        .reject-button {

            padding:
                9px
                14px;

            border: none;

            border-radius: 7px;

            background: #d95569;

            color: white;

            font-weight: bold;
        }

  </style>

</head>


<body>


<button
        class="back-button"
        onclick="goBack()">

  ←

</button>


<div class="page">


  <h1>
    FRIENDS
  </h1>


  <!-- CURRENT PLAYER -->

  <div class="player-box">

    <div class="small-label">
      YOUR PLAYER ID
    </div>


    <div id="playerId">
      Loading...
    </div>


    <div class="hint">
      Share this Player ID with your friends
    </div>

  </div>



  <!-- ADD FRIEND -->

  <div class="card">

    <h2>
      ADD A FRIEND
    </h2>


    <label>
      Enter Username, Code or Name#Code
    </label>


    <div class="search-row">

      <input
              id="searchInput"
              type="text"
              placeholder="Example: Shoon#274143">


      <button
              class="search-button"
              onclick="searchPlayer()">

        SEARCH

      </button>

    </div>


    <div id="foundPlayer">

      <div id="foundName"></div>

      <div id="foundId"></div>

    </div>


    <button
            id="sendButton"
            onclick="sendFriendRequest()"
            disabled>

      SEND FRIEND REQUEST

    </button>


    <div id="searchMessage"></div>

  </div>



  <!-- FRIEND REQUESTS -->

  <div class="card">

    <div class="title-row">

      <h2>
        FRIEND REQUESTS
      </h2>


      <button
              class="refresh-button"
              onclick="loadRequests()">

        REFRESH

      </button>

    </div>


    <div id="requestsList">

      <div class="empty">
        Loading requests...
      </div>

    </div>

  </div>



  <!-- FRIEND LIST -->

  <div class="card">

    <div class="title-row">

      <h2>
        MY FRIENDS
      </h2>


      <button
              class="refresh-button"
              onclick="loadFriends()">

        REFRESH

      </button>

    </div>


    <div id="friendsList">

      <div class="empty">
        Loading friends...
      </div>

    </div>

  </div>

</div>



<script>var parameters =
    new URLSearchParams(
        window.location.search
    );


var username =
    parameters.get("user");


if (!username) {

    username =
        sessionStorage.getItem(
            "username"
        );
}


if (!username) {

    window.location.replace(
        "/login.html"
    );
}


sessionStorage.setItem(
    "username",
    username
);


var selectedTarget =
    null;



// =================================================
// CURRENT USER
// =================================================

async function loadMe() {

    try {

        var response =
            await fetch(
                "/api/friends/me?username="
                + encodeURIComponent(username)
            );


        var data =
            await response.json();


        if (!response.ok) {

            document.getElementById(
                "playerId"
            ).textContent =
                data.message ||
                "Cannot load player.";

            return;
        }


        document.getElementById(
            "playerId"
        ).textContent =
            data.playerId;


        sessionStorage.setItem(
            "friendCode",
            data.friendCode
        );


    } catch (error) {

        console.error(error);


        document.getElementById(
            "playerId"
        ).textContent =
            "Cannot connect to server.";
    }
}



// =================================================
// SEARCH
// =================================================

async function searchPlayer() {

    var query =
        document.getElementById(
            "searchInput"
        ).value.trim();


    var message =
        document.getElementById(
            "searchMessage"
        );


    selectedTarget =
        null;


    document.getElementById(
        "sendButton"
    ).disabled =
        true;


    document.getElementById(
        "foundPlayer"
    ).style.display =
        "none";


    message.className =
        "error";


    message.textContent =
        "";


    if (!query) {

        message.textContent =
            "Please enter a Player ID.";

        return;
    }


    try {

        var url =
            "/api/friends/search?query="
            + encodeURIComponent(query)
            + "&username="
            + encodeURIComponent(username);


        var response =
            await fetch(url);


        var data =
            await response.json();


        if (!response.ok) {

            message.textContent =
                data.message ||
                "Player not found.";

            return;
        }


        selectedTarget =
            data.playerId;


        document.getElementById(
            "foundName"
        ).textContent =
            data.username;


        document.getElementById(
            "foundId"
        ).textContent =
            data.playerId;


        document.getElementById(
            "foundPlayer"
        ).style.display =
            "block";


        document.getElementById(
            "sendButton"
        ).disabled =
            false;


        message.className =
            "success";


        message.textContent =
            "Player found.";


    } catch (error) {

        console.error(error);


        message.textContent =
            "Cannot connect to server.";
    }
}



// =================================================
// SEND REQUEST
// =================================================

async function sendFriendRequest() {

    var message =
        document.getElementById(
            "searchMessage"
        );


    if (!selectedTarget) {

        message.className =
            "error";


        message.textContent =
            "Search Player ID first.";

        return;
    }


    try {

        var response =
            await fetch(
                "/api/friends/request",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },body:
                        JSON.stringify({

                            username:
                                username,

                            target:
                                selectedTarget
                        })
                }
            );


        var data =
            await response.json();


        if (!response.ok) {

            message.className =
                "error";


            message.textContent =
                data.message ||
                "Cannot send request.";

            return;
        }


        message.className =
            "success";


        message.textContent =
            data.message ||
            "Friend request sent!";


        document.getElementById(
            "sendButton"
        ).disabled =
            true;


    } catch (error) {

        console.error(error);


        message.className =
            "error";


        message.textContent =
            "Cannot connect to server.";
    }
}



// =================================================
// LOAD REQUESTS
// =================================================

async function loadRequests() {

    var container =
        document.getElementById(
            "requestsList"
        );


    container.innerHTML =
        "";


    var loading =
        document.createElement(
            "div"
        );


    loading.className =
        "empty";


    loading.textContent =
        "Loading requests...";


    container.appendChild(
        loading
    );


    try {

        var response =
            await fetch(
                "/api/friends/requests?username="
                + encodeURIComponent(username)
            );


        var data =
            await response.json();


        console.log(
            "REQUEST DATA:",
            data
        );


        container.innerHTML =
            "";


        if (!response.ok) {

            showEmpty(
                container,
                data.message ||
                "Cannot load requests."
            );

            return;
        }


        if (!Array.isArray(data)
                || data.length === 0) {

            showEmpty(
                container,
                "No friend requests."
            );

            return;
        }


        data.forEach(
            function (item) {

                var row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "request-item";


                var info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "person-data";


                var name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "person-name";


                name.textContent =
                    item.username;


                var playerId =
                    document.createElement(
                        "div"
                    );


                playerId.className =
                    "person-id";


                playerId.textContent =
                    item.playerId;


                info.appendChild(
                    name
                );


                info.appendChild(
                    playerId
                );


                var accept =
                    document.createElement(
                        "button"
                    );


                accept.className =
                    "accept-button";


                accept.textContent =
                    "ACCEPT";


                accept.onclick =
                    function () {

                        acceptRequest(
                            item.friendId
                        );
                    };


                var reject =
                    document.createElement(
                        "button"
                    );reject.className =
                    "reject-button";


                reject.textContent =
                    "REJECT";


                reject.onclick =
                    function () {

                        rejectRequest(
                            item.friendId
                        );
                    };


                row.appendChild(
                    info
                );


                row.appendChild(
                    accept
                );


                row.appendChild(
                    reject
                );


                container.appendChild(
                    row
                );
            }
        );


    } catch (error) {

        console.error(
            error
        );


        container.innerHTML =
            "";


        showEmpty(
            container,
            "Cannot load requests."
        );
    }
}



// =================================================
// ACCEPT
// =================================================

async function acceptRequest(
    friendId
) {

    try {

        var url =
            "/api/friends/"
            + friendId
            + "/accept?username="
            + encodeURIComponent(
                username
            );


        var response =
            await fetch(
                url,
                {
                    method:
                        "POST"
                }
            );


        var data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Cannot accept request."
            );

            return;
        }


        alert(
            "Friend request accepted!"
        );


        await loadRequests();

        await loadFriends();


    } catch (error) {

        console.error(
            error
        );


        alert(
            "Cannot connect to server."
        );
    }
}



// =================================================
// REJECT
// =================================================

async function rejectRequest(
    friendId
) {

    try {

        var url =
            "/api/friends/"
            + friendId
            + "/reject?username="
            + encodeURIComponent(
                username
            );


        var response =
            await fetch(
                url,
                {
                    method:
                        "POST"
                }
            );


        var data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Cannot reject request."
            );

            return;
        }


        await loadRequests();


    } catch (error) {

        console.error(
            error
        );


        alert(
            "Cannot connect to server."
        );
    }
}



// =================================================
// FRIEND LIST
// =================================================

async function loadFriends() {

    var container =
        document.getElementById(
            "friendsList"
        );


    container.innerHTML =
        "";


    try {

        var response =
            await fetch(
                "/api/friends/list?username="
                + encodeURIComponent(
                    username
                )
            );


        var data =
            await response.json();


        if (!response.ok) {

            showEmpty(
                container,
                "Cannot load friends."
            );

            return;
        }


        if (!Array.isArray(data)
                || data.length === 0) {

            showEmpty(
                container,
                "No friends yet."
            );

            return;
        }


        data.forEach(
            function (item) {

                var row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "friend-item";var info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "person-data";


                var name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "person-name";


                name.textContent =
                    item.username;


                var playerId =
                    document.createElement(
                        "div"
                    );


                playerId.className =
                    "person-id";


                playerId.textContent =
                    item.playerId;


                info.appendChild(
                    name
                );


                info.appendChild(
                    playerId
                );


                row.appendChild(
                    info
                );


                container.appendChild(
                    row
                );
            }
        );


    } catch (error) {

        console.error(
            error
        );


        showEmpty(
            container,
            "Cannot load friends."
        );
    }
}



// =================================================
// EMPTY BOX
// =================================================

function showEmpty(
    container,
    text
) {

    container.innerHTML =
        "";


    var box =
        document.createElement(
            "div"
        );


    box.className =
        "empty";


    box.textContent =
        text;


    container.appendChild(
        box
    );
}



// =================================================
// BACK
// =================================================

function goBack() {

    window.location.href =
        "/homepage.html?user="
        + encodeURIComponent(
            username
        );
}



// =================================================
// ENTER SEARCH
// =================================================

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                searchPlayer();
            }
        }
    );



// =================================================
// INITIAL LOAD
// =================================================

window.addEventListener(
    "load",
    function () {

        loadMe();

        loadRequests();

        loadFriends();
    }
);

</script>


</body>
<div style="position:fixed;top:0;left:0;background:red;color:white;z-index:999999;">
  NEW FRIENDS FILE
</div>
</html>
