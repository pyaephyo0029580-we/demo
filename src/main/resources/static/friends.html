<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Friends</title>

  <style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family: Arial, sans-serif;

        background:
                radial-gradient(
                        circle at top,
                        #1e293b,
                        #0f172a 55%,
                        #020617
                );

        color: white;
    }

    .page {
        max-width: 720px;

        margin: auto;

        padding: 30px 20px 60px;
    }

    h1 {
        text-align: center;

        font-size: 36px;
    }

    .card {
        background: #1e293b;

        border: 1px solid #334155;

        border-radius: 16px;

        padding: 22px;

        margin-bottom: 20px;
    }

    .player-card {
        text-align: center;
    }

    .small-title {
        color: #94a3b8;

        font-size: 13px;

        font-weight: bold;
    }

    #myPlayerId {
        color: #38bdf8;

        font-size: 26px;

        font-weight: bold;

        margin-top: 8px;
    }

    .help-text {
        color: #94a3b8;

        font-size: 13px;

        margin-top: 8px;
    }

    h2 {
        margin-top: 0;
    }

    .search-row {
        display: flex;

        gap: 10px;
    }

    input {
        flex: 1;

        height: 46px;

        padding: 0 15px;

        border: none;

        border-radius: 10px;

        outline: none;

        font-size: 15px;
    }

    button {
        border: none;

        border-radius: 9px;

        cursor: pointer;

        color: white;

        font-weight: bold;
    }

    .search-button {
        width: 120px;

        background: #2563eb;
    }

    .send-button {
        display: block;

        width: 250px;

        max-width: 100%;

        height: 45px;

        margin: 15px auto 0;

        background: #22c55e;
    }

    #messageLabel {
        min-height: 20px;

        color: #facc15;

        text-align: center;

        font-weight: bold;
    }

    .section-header {
        display: flex;

        justify-content: space-between;

        align-items: center;
    }

    .refresh-button {
        padding: 10px 15px;

        background: #64748b;
    }

    #requestsList,
    #friendsList {
        background: #111827;

        border: 1px solid #334155;

        border-radius: 12px;

        padding: 10px;

        min-height: 90px;
    }

    .friend-request,
    .friend-item {
        display: flex;

        align-items: center;

        gap: 8px;

        background: #1f2937;

        padding: 12px;

        margin-bottom: 8px;

        border-radius: 10px;
    }

    .friend-name {
        flex: 1;

        font-weight: bold;
    }

    .accept-button {
        background: #22c55e;

        padding: 9px 12px;
    }

    .reject-button {
        background: #ef4444;

        padding: 9px 12px;
    }

    .empty {
        text-align: center;

        padding: 25px;

        color: #64748b;
    }

    .back-button {
        width: 100%;

        height: 45px;

        background: #334155;
    }

  </style>

</head>


<body>

<div class="page">

  <h1>FRIENDS</h1>


  <!-- MY PLAYER ID -->

  <div class="card player-card">

    <div class="small-title">
      YOUR PLAYER ID
    </div>

    <div id="myPlayerId">
      Loading...
    </div><div class="help-text">
    Share this Player ID with your friends
  </div>

  </div>


  <!-- ADD FRIEND -->

  <div class="card">

    <h2>ADD A FRIEND</h2>

    <div class="help-text">
      Enter your friend's Name#Code
    </div>

    <br>

    <div class="search-row">

      <input
              id="playerIdField"
              type="text"
              placeholder="Example: Marsuki#482917">

      <button
              class="search-button"
              onclick="searchPlayer()">
        SEARCH
      </button>

    </div>

    <button
            class="send-button"
            onclick="sendFriendRequest()">
      SEND FRIEND REQUEST
    </button>

    <p id="messageLabel"></p>

  </div>


  <!-- REQUESTS -->

  <div class="card">

    <div class="section-header">

      <h2>FRIEND REQUESTS</h2>

      <button
              class="refresh-button"
              onclick="refreshFriends()">
        REFRESH
      </button>

    </div>

    <div id="requestsList">

      <div class="empty">
        Loading...
      </div>

    </div>

  </div>


  <!-- FRIENDS -->

  <div class="card">

    <h2>MY FRIENDS</h2>

    <div id="friendsList">

      <div class="empty">
        Loading...
      </div>

    </div>

  </div>


  <button
          class="back-button"
          onclick="goBack()">
    BACK
  </button>

</div>


<script>

  // ==========================================
  // LOGIN USER
  // ==========================================

  const params =
      new URLSearchParams(
          window.location.search
      );

  const loginUser =
      params.get("user");

  let currentUser = null;

  let searchedUser = null;


  // ==========================================
  // PAGE START
  // ==========================================

  document.addEventListener(
      "DOMContentLoaded",
      async function () {

          if (!loginUser) {

              document.getElementById(
                  "myPlayerId"
              ).textContent =
                  "Unknown Player";

              showMessage(
                  "Login user missing."
              );

              return;
          }

          await loadCurrentUser();
      }
  );


  // ==========================================
  // CURRENT USER
  // ==========================================

  async function loadCurrentUser() {

      try {

          const response =
              await fetch(
                  "/api/friends/me?username=" +
                  encodeURIComponent(
                      loginUser
                  )
              );

          const data =
              await response.json();

          if (!response.ok) {

              document.getElementById(
                  "myPlayerId"
              ).textContent =
                  "Unknown Player";

              showMessage(
                  data.message ||
                  "Cannot load user."
              );

              return;
          }

          currentUser = data;

          document.getElementById(
              "myPlayerId"
          ).textContent =
              data.username +
              "#" +
              data.friendCode;

          await loadRequests();

          await loadFriends();

      } catch (error) {

          console.error(error);

          document.getElementById(
              "myPlayerId"
          ).textContent =
              "Unknown Player";

          showMessage(
              "Cannot connect to server."
          );
      }
  }


  // ==========================================
  // SEARCH
  // ==========================================

  async function searchPlayer() {

      searchedUser = null;const playerId =
            document.getElementById(
                "playerIdField"
            ).value.trim();

        if (!playerId) {

            showMessage(
                "Enter Player ID."
            );

            return;
        }

        try {

            const response =
                await fetch(
                    "/api/friends/search?playerId=" +
                    encodeURIComponent(
                        playerId
                    )
                );

            const data =
                await response.json();

            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Player not found."
                );

                return;
            }

            if (
                currentUser &&
                Number(data.id) ===
                Number(currentUser.id)
            ) {

                showMessage(
                    "You cannot add yourself."
                );

                return;
            }

            searchedUser = data;

            showMessage(
                "Found: " +
                data.username +
                "#" +
                data.friendCode
            );

        } catch (error) {

            console.error(error);

            showMessage(
                "Search failed."
            );
        }
    }


    // ==========================================
    // SEND REQUEST
    // ==========================================

    async function sendFriendRequest() {

        if (!currentUser) {

            showMessage(
                "Current user not loaded."
            );

            return;
        }

        if (!searchedUser) {

            showMessage(
                "Search Player ID first."
            );

            return;
        }

        try {

            const url =
                "/api/friends/request" +
                "?requesterId=" +
                encodeURIComponent(
                    currentUser.id
                ) +
                "&receiverId=" +
                encodeURIComponent(
                    searchedUser.id
                );

            const response =
                await fetch(
                    url,
                    {
                        method: "POST"
                    }
                );

            const data =
                await response.json();

            showMessage(
                data.message
            );

            if (response.ok) {

                document.getElementById(
                    "playerIdField"
                ).value = "";

                searchedUser = null;

                await loadRequests();

                await loadFriends();
            }

        } catch (error) {

            console.error(error);

            showMessage(
                "Cannot send friend request."
            );
        }
    }


    // ==========================================
    // LOAD REQUESTS
    // ==========================================

    async function loadRequests() {

        if (!currentUser) {
            return;
        }

        const container =
            document.getElementById(
                "requestsList"
            );

        try {

            const response =
                await fetch(
                    "/api/friends/requests?userId=" +
                    encodeURIComponent(
                        currentUser.id
                    )
                );

            const requests =
                await response.json();

            container.innerHTML = "";

            if (!response.ok) {

                container.innerHTML =
                    '<div class="empty">' +
                    'Cannot load requests.' +
                    '</div>';

                return;
            }

            if (
                !Array.isArray(requests) ||
                requests.length === 0
            ) {container.innerHTML =
                    '<div class="empty">' +
                    'No pending requests.' +
                    '</div>';

                return;
            }

            requests.forEach(
                request => {

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.className =
                        "friend-request";


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "friend-name";

                    name.textContent =
                        request.username +
                        "#" +
                        request.friendCode;


                    const accept =
                        document.createElement(
                            "button"
                        );

                    accept.className =
                        "accept-button";

                    accept.textContent =
                        "ACCEPT";

                    accept.onclick =
                        () =>
                            acceptRequest(
                                request.friendId
                            );


                    const reject =
                        document.createElement(
                            "button"
                        );

                    reject.className =
                        "reject-button";

                    reject.textContent =
                        "REJECT";

                    reject.onclick =
                        () =>
                            rejectRequest(
                                request.friendId
                            );


                    row.appendChild(name);

                    row.appendChild(accept);

                    row.appendChild(reject);

                    container.appendChild(row);
                }
            );

        } catch (error) {

            console.error(error);

            container.innerHTML =
                '<div class="empty">' +
                'Cannot load requests.' +
                '</div>';
        }
    }


    // ==========================================
    // ACCEPT
    // ==========================================

    async function acceptRequest(
        friendId
    ) {

        try {

            const response =
                await fetch(
                    "/api/friends/" +
                    encodeURIComponent(friendId) +
                    "/accept?userId=" +
                    encodeURIComponent(
                        currentUser.id
                    ),
                    {
                        method: "POST"
                    }
                );

            const data =
                await response.json();

            showMessage(
                data.message
            );

            if (response.ok) {

                await loadRequests();

                await loadFriends();
            }

        } catch (error) {

            console.error(error);

            showMessage(
                "Cannot accept request."
            );
        }
    }


    // ==========================================
    // REJECT
    // ==========================================

    async function rejectRequest(
        friendId
    ) {

        try {

            const response =
                await fetch(
                    "/api/friends/" +
                    encodeURIComponent(friendId) +
                    "/reject?userId=" +
                    encodeURIComponent(
                        currentUser.id
                    ),
                    {
                        method: "DELETE"
                    }
                );

            const data =
                await response.json();

            showMessage(
                data.message
            );

            if (response.ok) {

                await loadRequests();await loadFriends();
            }

        } catch (error) {

            console.error(error);

            showMessage(
                "Cannot reject request."
            );
        }
    }


    // ==========================================
    // LOAD FRIENDS
    // ==========================================

    async function loadFriends() {

        if (!currentUser) {
            return;
        }

        const container =
            document.getElementById(
                "friendsList"
            );

        try {

            const response =
                await fetch(
                    "/api/friends/list?userId=" +
                    encodeURIComponent(
                        currentUser.id
                    )
                );

            const friends =
                await response.json();

            container.innerHTML = "";

            if (!response.ok) {

                container.innerHTML =
                    '<div class="empty">' +
                    'Cannot load friends.' +
                    '</div>';

                return;
            }

            if (
                !Array.isArray(friends) ||
                friends.length === 0
            ) {

                container.innerHTML =
                    '<div class="empty">' +
                    'No friends yet.' +
                    '</div>';

                return;
            }

            friends.forEach(
                friend => {

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.className =
                        "friend-item";


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "friend-name";

                    name.textContent =
                        friend.username +
                        "#" +
                        friend.friendCode;


                    row.appendChild(name);

                    container.appendChild(row);
                }
            );

        } catch (error) {

            console.error(error);

            container.innerHTML =
                '<div class="empty">' +
                'Cannot load friends.' +
                '</div>';
        }
    }


    // ==========================================
    // REFRESH
    // ==========================================

    async function refreshFriends() {

        if (!currentUser) {

            showMessage(
                "Current user not loaded."
            );

            return;
        }

        await loadRequests();

        await loadFriends();

        showMessage(
            "Updated."
        );
    }


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(message) {

        document.getElementById(
            "messageLabel"
        ).textContent =
            message || "";
    }


    // ==========================================
    // BACK
    // ==========================================

    function goBack() {

        window.location.href =
            "homepage.html?user=" +
            encodeURIComponent(
                loginUser || ""
            );
    }

</script>

</body>
</html>
