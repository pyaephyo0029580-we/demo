<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charge Release</title>

  <style>
    *{box-sizing:border-box}

    body{
        margin:0;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:Arial,sans-serif;
        color:white;
        background:linear-gradient(135deg,#040817,#142456);
    }

    .game{
        width:600px;
        max-width:95%;
        padding:30px;
        text-align:center;
        border:2px solid #3bd7ff;
        border-radius:24px;
        background:#081a43;
    }

    .meter{
        position:relative;
        width:100%;
        height:65px;
        margin:30px 0;
        border-radius:18px;
        overflow:hidden;
        background:#102f67;
    }

    .green-zone{
        position:absolute;
        left:65%;
        width:15%;
        height:100%;
        background:rgba(80,255,160,.35);
        border-left:3px solid #64ffae;
        border-right:3px solid #64ffae;
    }

    #chargeBar{
        position:absolute;
        left:0;
        top:0;
        width:0%;
        height:100%;
        background:linear-gradient(90deg,#1ed6ff,#6877ff);
    }

    #holdButton{
        width:100%;
        height:58px;
        border:none;
        border-radius:12px;
        font-size:18px;
        font-weight:bold;
        cursor:pointer;
    }

    #message{
        min-height:35px;
        margin-top:20px;
        font-size:22px;
        font-weight:bold;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>⚡ Charge Release</h1>

  <p>
    Hold the button to charge.
    Release inside the green zone.
  </p>

  <div>
    Success:
    <span id="score">0</span> / 5
  </div>

  <div class="meter">

    <div class="green-zone"></div>

    <div id="chargeBar"></div>

  </div>

  <button id="holdButton">
    HOLD TO CHARGE
  </button>

  <div id="message"></div>

</div>

<script>

  const bar =
      document.getElementById("chargeBar");

  const button =
      document.getElementById("holdButton");

  const scoreText =
      document.getElementById("score");

  const message =
      document.getElementById("message");

  let charge = 0;
  let charging = false;
  let success = 0;
  let interval = null;
  let complete = false;


  function startCharging(){

      if(complete) return;

      charging = true;

      clearInterval(interval);

      interval = setInterval(()=>{

          if(!charging) return;

          charge += 1.2;

          if(charge >= 100){
              charge = 100;
              stopCharging();
          }

          bar.style.width =
              charge + "%";

      },16);
  }


  function stopCharging(){

      if(!charging) return;

      charging = false;

      clearInterval(interval);

      if(charge >= 65 && charge <= 80){

          success++;

          scoreText.textContent =
              success;

          message.textContent =
              "✓ Perfect release!";

          message.style.color =
              "#65ffae";

          if(success >= 5){

              complete = true;

              message.textContent =
                  "✓ TASK COMPLETE";

              button.disabled = true;

              return;
          }

      }else{

          message.textContent =
              "✕ Missed the zone";

          message.style.color =
              "#ff7272";
      }

      setTimeout(()=>{

          if(!complete){

              charge = 0;

              bar.style.width =
                  "0%";

              message.textContent =
                  "";
          }

      },500);
  }


  button.addEventListener(
      "mousedown",
      startCharging
  );

  button.addEventListener(
      "mouseup",
      stopCharging
  );

  button.addEventListener(
      "mouseleave",
      stopCharging
  );

  button.addEventListener(
      "touchstart",
      e=>{
          e.preventDefault();
          startCharging();
      },
      {passive:false}
  );

  button.addEventListener(
      "touchend",
      e=>{
          e.preventDefault();
          stopCharging();
      },
      {passive:false}
  );

</script>

</body>
</html>
