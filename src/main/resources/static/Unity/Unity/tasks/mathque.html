<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Lock</title>

  <style>
    *{
        box-sizing:border-box;
    }

    body{
        margin:0;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        font-family:Arial,sans-serif;
        color:white;
        background:linear-gradient(135deg,#040817,#142456);
    }

    .game{
        width:550px;
        max-width:95%;
        padding:30px;
        border:2px solid #3bd7ff;
        border-radius:24px;
        background:#081a43;
        text-align:center;
    }

    .lock{
        font-size:70px;
        margin:20px;
    }

    #question{
        margin:25px 0;
        font-size:38px;
        font-weight:bold;
        color:#69e7ff;
    }

    input{
        width:100%;
        height:60px;
        border:2px solid #376da8;
        border-radius:12px;
        background:#071932;
        color:white;
        text-align:center;
        font-size:26px;
    }

    button{
        width:100%;
        height:50px;
        margin-top:15px;
        border:none;
        border-radius:12px;
        font-size:17px;
        font-weight:bold;
        cursor:pointer;
    }

    #message{
        min-height:35px;
        margin-top:20px;
        font-size:22px;
        font-weight:bold;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>🔐 Math Lock</h1>

  <div class="lock" id="lock">
    🔒
  </div>

  <div>
    Solved:
    <span id="score">0</span>/5
  </div>

  <div id="question"></div>

  <input
          id="answer"
          type="number"
          placeholder="Enter answer"
  >

  <button id="check">
    CHECK
  </button>

  <div id="message"></div>

</div>

<script>

  // 🛑 ၁။ ပေ့ချ်စဖွင့်ချင်းတွင် ဤ Task ပြီးမြောက်ပြီးသားဖြစ်မဖြစ် စစ်ဆေးခြင်း
  if (sessionStorage.getItem('math_lock_completed') === 'true') {
      alert("This task is already completed in this session!");
      if (window.parent && window.parent.closeTaskModal) {
          window.parent.closeTaskModal();
      }
  }

  const questionText = document.getElementById("question");
  const answerInput = document.getElementById("answer");
  const scoreText = document.getElementById("score");
  const message = document.getElementById("message");
  const lock = document.getElementById("lock");
  const checkButton = document.getElementById("check");

  let correctAnswer = 0;
  let score = 0;
  let isCompleted = false;


  function newQuestion(){
      if(isCompleted) return;

      const a = Math.floor(Math.random()*10)+2;
      const b = Math.floor(Math.random()*10)+1;
      const operators = ["+","-","×"];
      const operator = operators[Math.floor(Math.random()*operators.length)];

      if(operator === "+"){
          correctAnswer = a + b;
      }else if(operator === "-"){
          correctAnswer = a - b;
      }else{
          correctAnswer = a * b;
      }

      questionText.textContent = a + " " + operator + " " + b + " = ?";
      answerInput.value = "";
      answerInput.focus();
  }


  function checkAnswer(){
      if(isCompleted) return;

      const answer = Number(answerInput.value);

      if(answer === correctAnswer){
          score++;
          scoreText.textContent = score;

          if(score >= 5){
              isCompleted = true;
              lock.textContent = "🔓";
              message.textContent = "✓ LOCK OPEN — TASK COMPLETE";
              message.style.color = "#65ffae";

              checkButton.disabled = true;
              answerInput.disabled = true;

              // 🛑 ၂။ Task ပြီးဆုံးပါက sessionStorage ထဲတွင် မှတ်တမ်းတင်ခြင်း
              sessionStorage.setItem('math_lock_completed', 'true');

              // 🛑 ၃။ 20 coins API ခေါ်ခြင်းကို ဖယ်ရှားပြီး Modal ကို ပိတ်ရန် completeTask သို့ ပို့ခြင်း
              completeTask();
              return;
          }

          message.textContent = "✓ Correct";
          message.style.color = "#65ffae";

          setTimeout(()=>{
              if(!isCompleted){
                  message.textContent = "";
                  newQuestion();
              }
          }, 500);

      }else{
          message.textContent = "✕ Wrong answer";
          message.style.color = "#ff7272";
      }
  }


  function completeTask(){
      setTimeout(() => {
          if (window.parent && window.parent.closeTaskModal) {
              window.parent.closeTaskModal();
          }
      }, 500);
  }


  checkButton.addEventListener("click", checkAnswer);

  answerInput.addEventListener("keydown", e => {
      if(e.key === "Enter"){
          checkAnswer();
      }
  });


  newQuestion();

</script>

</body>
</html>
