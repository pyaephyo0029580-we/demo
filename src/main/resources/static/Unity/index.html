<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | real map1</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- NippleJS CDN for Virtual Joystick -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <style>
        #inGameSettingsBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: #21262d;
            color: white;
            border: 2px solid #30363d;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        #joystickZone {
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 140px;
            height: 140px;
            z-index: 9999;
            touch-action: none;
        }

        #gameSettingsModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
<div id="unity-container" class="unity-desktop">
    <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
            <div id="unity-loading-bar">
                <div id="unity-logo"></div>
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">real map1</div>
    </div>
</div>

<!-- UI Overlay Elements -->
<button id="inGameSettingsBtn" onclick="openGameSettings()">⚙️ Settings</button>
<div id="joystickZone"></div>

<!-- Settings Modal -->
<div id="gameSettingsModal">
    <div style="background: #161b22; border: 2px solid #30363d; border-radius: 16px; width: 340px; padding: 25px; color: white; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
        <h2 style="margin-top: 0; font-size: 20px; border-bottom: 1px solid #30363d; padding-bottom: 10px; text-align: center;">Game Settings</h2>

        <div style="margin: 20px 0; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 15px; font-weight: bold;">Virtual Joystick</span>
            <input type="checkbox" id="joystickToggle" checked onchange="toggleJoystick(this)" style="width: 20px; height: 20px; cursor: pointer;">
        </div>

        <button onclick="leaveGame()" style="width: 100%; padding: 12px; background-color: #d95569; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;">🚪 Leave Game</button>
        <button onclick="closeGameSettings()" style="width: 100%; padding: 10px; background-color: #30363d; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;">Close</button>
    </div>
</div>

<script>
    var joystickManager = null;
    var currentUnityInstance = null; // Unity Instance သိမ်းဆည်းရန်

    function initJoystick() {
        var zone = document.getElementById('joystickZone');
        zone.innerHTML = "";
        joystickManager = nipplejs.create({
            zone: zone,
            mode: 'static',
            position: { left: '70px', top: '70px' },
            color: '#58a6ff',
            size: 110
        });

        joystickManager.on('move', function (evt, data) {
            if (data && data.angle) {
                var degree = data.angle.degree;

                // Unity ဘက်သို့ SendMessage ဖြင့် တန်ဖိုးပို့ခြင်း
                if (currentUnityInstance) {
                    // ဥပမာ - Unity ရှိ 'Player' object ပေါ်ရှိ 'OnJoystickMove' method သို့ degree ပို့မည်
                    currentUnityInstance.SendMessage('Player', 'OnJoystickMove', degree);
                }
            }
        });
    }

    function openGameSettings() {
        document.getElementById('gameSettingsModal').style.display = 'flex';
    }

    function closeGameSettings() {
        document.getElementById('gameSettingsModal').style.display = 'none';
    }

    function toggleJoystick(checkbox) {
        var joystickZone = document.getElementById('joystickZone');
        if (checkbox.checked) {
            joystickZone.style.display = 'block';
            if (!joystickManager) {
                initJoystick();
            }
        } else {
            joystickZone.style.display = 'none';
            if (joystickManager) {
                joystickManager.destroy();
                joystickManager = null;
            }
        }
    }

    function leaveGame() {
        var urlParams = new URLSearchParams(window.location.search);
        var username = urlParams.get('username') || sessionStorage.getItem("username") || "Player";
        window.location.href = `/homepage.html?user=` + encodeURIComponent(username);
    }

    window.addEventListener('load', function() {
        initJoystick();
    });

    let canvas = document.querySelector("#unity-canvas");
    let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function() {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Final14.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Final14.data",
      frameworkUrl: buildUrl + "/Final14.framework.js",
      codeUrl: buildUrl + "/Final14.wasm",
      streamingAssetsUrl: "StreamingAssets",
      fullscreenElementID: "unity-fullscreen-container",
      companyName: "DefaultCompany",
      productName: "real map1",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      fullscreenContainer.style.width = "960px";
      fullscreenContainer.style.height = "600px";
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      const loadingContainer = document.querySelector("#unity-loading-container");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");

      createUnityInstance(canvas, config, (progress) => {
        if (progress < 1) {
          loadingContainer.style.display = "block";
          progressBarFull.style.width = 100 * progress + "%";
        } else {
          loadingContainer.style.display = "none";
        }
      }).then((unityInstance) => {
        currentUnityInstance = unityInstance; // Unity instance အောင်မြင်စွာ load ပြီးသောအခါ သိမ်းဆည်းမည်
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);
</script>
</body>
</html>
