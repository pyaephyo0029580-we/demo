<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Lock</title>

  <style>
    *{
        box-sizing:border-box;
    }

    body{
        margin:0;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        font-family:Arial,sans-serif;
        color:white;
        background:linear-gradient(135deg,#040817,#142456);
    }

    .game{
        width:550px;
        max-width:95%;
        padding:30px;
        border:2px solid #3bd7ff;
        border-radius:24px;
        background:#081a43;
        text-align:center;
    }

    .lock{
        font-size:70px;
        margin:20px;
    }

    #question{
        margin:25px 0;
        font-size:38px;
        font-weight:bold;
        color:#69e7ff;
    }

    input{
        width:100%;
        height:60px;
        border:2px solid #376da8;
        border-radius:12px;
        background:#071932;
        color:white;
        text-align:center;
        font-size:26px;
    }

    button{
        width:100%;
        height:50px;
        margin-top:15px;
        border:none;
        border-radius:12px;
        font-size:17px;
        font-weight:bold;
        cursor:pointer;
    }

    #message{
        min-height:35px;
        margin-top:20px;
        font-size:22px;
        font-weight:bold;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>🔐 Math Lock</h1>

  <div class="lock" id="lock">
    🔒
  </div>

  <div>
    Solved:
    <span id="score">0</span>/5
  </div>

  <div id="question"></div>

  <input
          id="answer"
          type="number"
          placeholder="Enter answer"
  >

  <button id="check">
    CHECK
  </button>

  <div id="message"></div>

</div>

<script>

  const questionText =
      document.getElementById("question");

  const answerInput =
      document.getElementById("answer");

  const scoreText =
      document.getElementById("score");

  const message =
      document.getElementById("message");

  const lock =
      document.getElementById("lock");

  const checkButton =
      document.getElementById("check");

  let correctAnswer = 0;
  let score = 0;


  function newQuestion(){

      const a =
          Math.floor(Math.random()*10)+2;

      const b =
          Math.floor(Math.random()*10)+1;

      const operators =
          ["+","-","×"];

      const operator =
          operators[
              Math.floor(
                  Math.random()*operators.length
              )
          ];


      if(operator === "+"){

          correctAnswer =
              a+b;

      }else if(operator === "-"){

          correctAnswer =
              a-b;

      }else{

          correctAnswer =
              a*b;
      }


      questionText.textContent =
          a +
          " " +
          operator +
          " " +
          b +
          " = ?";


      answerInput.value =
          "";

      answerInput.focus();
  }


  function checkAnswer(){

      const answer =
          Number(answerInput.value);


      if(answer === correctAnswer){

          score++;

          scoreText.textContent =
              score;


          if(score >= 5){

              lock.textContent =
                  "🔓";

              message.textContent =
                  "✓ LOCK OPEN — TASK COMPLETE";

              message.style.color =
                  "#65ffae";

              checkButton.disabled =
                  true;

              answerInput.disabled =
                  true;

              return;
          }


          message.textContent =
              "✓ Correct";

          message.style.color =
              "#65ffae";


          setTimeout(
              ()=>{
                  message.textContent="";
                  newQuestion();
              },
              500
          );

      }else{

          message.textContent =
              "✕ Wrong answer";

          message.style.color =
              "#ff7272";
      }
  }


  checkButton.addEventListener(
      "click",
      checkAnswer
  );


  answerInput.addEventListener(
      "keydown",
      e=>{

          if(e.key === "Enter"){
              checkAnswer();
          }
      }
  );


  newQuestion();

</script>

</body>
</html>
