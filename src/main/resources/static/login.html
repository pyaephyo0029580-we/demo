<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #150912;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 380px;
            padding: 30px;
            background: #251222;
            border: 2px solid #ff2a85;
            border-radius: 15px;
            color: white;
            box-shadow: 0 0 20px rgba(255, 42, 133, 0.25);
        }

        h1 {
            text-align: center;
            color: #ff2a85;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 42, 133, 0.5);
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            height: 48px;
            margin-bottom: 15px;
            padding: 0 15px;
            box-sizing: border-box;
            border: 2px solid #ff2a85;
            border-radius: 10px;
            background: #150912;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 10px rgba(255, 42, 133, 0.5);
        }

        button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #ff2a85;
            color: white;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #e61973;
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.6);
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
        }

        .signup-link a {
            color: #ff2a85;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #ff8b9b;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>LOGIN</h1>

    <input
            id="email"
            type="email"
            placeholder="Email">

    <input
            id="password"
            type="password"
            placeholder="Password">

    <button
            type="button"
            onclick="loginUser()">

        LOGIN

    </button>

    <!-- Sign Up ဆီ သွားမယ့် Link -->
    <div class="signup-link">
        Don't have an account? <a href="signup.html">Sign Up</a>
    </div>

    <div id="message"></div>

</div>


<script>

    async function loginUser() {

        var email =
            document.getElementById("email").value.trim();

        var password =
            document.getElementById("password").value;

        var message =
            document.getElementById("message");


        message.textContent =
            "Logging in...";


        if (!email || !password) {

            message.textContent =
                "Please enter email and password.";

            return;
        }


        try {

            var response =
                await fetch(
                    "/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "same-origin",

                        body:
                            JSON.stringify({
                                email: email,
                                password: password
                            })
                    }
                );


            var text =
                await response.text();


            console.log(
                "LOGIN STATUS:",
                response.status
            );

            console.log(
                "LOGIN RESPONSE:",
                text
            );


            var data;

            try {

                data =
                    JSON.parse(text);

            } catch (e) {

                message.textContent =
                    "Server error: " + text;

                return;
            }


            if (!response.ok) {

                message.textContent =
                    data.message ||
                    "Login failed.";

                return;
            }


            if (data.success === true) {

                // optional browser-side copy
                sessionStorage.setItem(
                    "userId",
                    String(data.id)
                );

                sessionStorage.setItem(
                    "username",
                    data.username
                );


                // MAIN REDIRECT
                window.location.replace(
                    "/homepage.html"
                );

            } else {

                message.textContent =
                    data.message ||
                    "Login failed.";
            }


        } catch (error) {

            console.error(error);

            message.textContent =
                "Cannot connect to server.";
        }
    }

    document
      .getElementById("password")
      .addEventListener(
          "keydown",
          function(event) {

              if (event.key === "Enter") {
                  loginUser();
              }
          }
      );

</script>

</body>
</html>
