<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - MyGaming</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #183d87 0%,
                    #0d2b67 38%,
                    #081d49 68%,
                    #041333 100%
                );

            color: white;
            padding: 30px 15px;
        }


        /* =========================
           SIGNUP CARD
           ========================= */

        .signup-card {

            width: 100%;
            max-width: 430px;

            padding: 38px 35px 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(44, 91, 190, 0.90),
                    rgba(35, 73, 158, 0.83)
                );

            border-radius: 18px;

            border: 1px solid
                rgba(90, 157, 255, 0.35);

            box-shadow:
                0 18px 45px
                rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(8px);
        }


        /* =========================
           TITLE
           ========================= */

        .signup-card h1 {

            text-align: center;

            font-size: 34px;
            font-weight: 800;

            margin-bottom: 8px;

            color: white;
        }


        .subtitle {

            text-align: center;

            color: rgba(
                255,
                255,
                255,
                0.78
            );

            font-size: 15px;

            margin-bottom: 28px;
        }


        /* =========================
           INPUT GROUP
           ========================= */

        .input-group {

            margin-bottom: 16px;
        }


        .input-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 700;

            color: white;
        }


        .input-group input {

            width: 100%;
            height: 48px;

            border: none;

            border-radius: 7px;

            padding: 0 15px;

            font-size: 15px;

            color: #222;

            background: white;

            outline: none;

            box-shadow:
                inset 0 0 0 1px
                rgba(0, 0, 0, 0.08);

            transition:
                box-shadow 0.2s,
                transform 0.2s;
        }


        .input-group input::placeholder {

            color: #8b95aa;
        }


        .input-group input:focus {

            box-shadow:
                0 0 0 3px
                rgba(66, 198, 255, 0.35);

            transform:
                translateY(-1px);
        }


        /* =========================
           PASSWORD
           ========================= */

        .password-wrapper {

            position: relative;
        }


        .password-wrapper input {

            padding-right: 65px;
        }


        .show-password {

            position: absolute;

            right: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            background: transparent;

            border: none;

            color: #183267;

            font-weight: bold;

            cursor: pointer;

            font-size: 13px;
        }


        /* =========================
           PASSWORD RULES
           ========================= */

        .password-rules {

            list-style: none;

            padding: 0;

            margin:
                10px 0 4px 4px;

            font-size: 12px;

            line-height: 1.65;color:
                rgba(
                    255,
                    255,
                    255,
                    0.68
                );
        }


        .password-rules li::before {

            content: "•";

            display: inline-block;

            margin-right: 8px;

            color: #7dcaff;
        }


        .password-rules li.valid {

            color: #71ffb1;

            font-weight: 600;
        }


        .password-rules li.valid::before {

            content: "✓";

            color: #71ffb1;
        }


        /* =========================
           BUTTON
           ========================= */

        #signupButton {

            width: 100%;
            height: 48px;

            border: none;

            border-radius: 7px;

            margin-top: 9px;

            background:
                linear-gradient(
                    90deg,
                    #22b6f6,
                    #42d4ff
                );

            color: white;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(24, 183, 244, 0.28);

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }


        #signupButton:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 26px
                rgba(24, 183, 244, 0.38);
        }


        #signupButton:active {

            transform:
                translateY(0);
        }


        #signupButton:disabled {

            opacity: 0.6;

            cursor:
                not-allowed;

            transform: none;
        }


        /* =========================
           MESSAGE
           ========================= */

        #message {

            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            font-size: 13px;

            font-weight: 700;
        }


        .error {

            color: #ffb5b5;
        }


        .success {

            color: #7dffb4;
        }


        /* =========================
           LOGIN LINK
           ========================= */

        .login-text {

            text-align: center;

            margin-top: 19px;

            font-size: 14px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.88
                );
        }


        .login-text a {

            color: #58ddff;

            text-decoration: none;

            font-weight: 800;
        }


        .login-text a:hover {

            text-decoration: underline;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (
            max-width: 500px
        ) {

            body {

                padding: 18px;
            }


            .signup-card {

                padding:
                    30px 22px;

                border-radius: 15px;
            }


            .signup-card h1 {

                font-size: 29px;
            }
        }

    </style>
</head>


<body>


<div class="signup-card">


    <h1>Create Account</h1>


    <p class="subtitle">
        Create your MyGaming account
    </p>


    <!-- =========================
         USERNAME
         ========================= -->

    <div class="input-group">

        <label for="username">
            Username
        </label>

        <input
                type="text"
                id="username"
                placeholder="Enter username"
                maxlength="30"
                autocomplete="username"
        >

    </div>



    <!-- =========================
         EMAIL
         ========================= -->

    <div class="input-group">

        <label for="email">
            Email
        </label><input
            type="email"
            id="email"
            placeholder="Enter email"
            autocomplete="email"
    >

    </div>



    <!-- =========================
         PASSWORD
         ========================= -->

    <div class="input-group">

        <label for="password">
            Password
        </label>


        <div class="password-wrapper">


            <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="new-password"
            >


            <button
                    type="button"
                    class="show-password"
                    id="showPasswordButton"
            >

                Show

            </button>


        </div>



        <ul class="password-rules">


            <li id="lengthRule">

                At least 8 characters

            </li>


            <li id="uppercaseRule">

                At least 1 uppercase letter

            </li>


            <li id="lowercaseRule">

                At least 1 lowercase letter

            </li>


            <li id="numberRule">

                At least 1 number

            </li>


            <li id="specialRule">

                At least 1 special character
                (@#$!%*?&)

            </li>


        </ul>

    </div>



    <!-- =========================
         CONFIRM PASSWORD
         ========================= -->

    <div class="input-group">

        <label for="confirmPassword">

            Confirm Password

        </label>


        <div class="password-wrapper">


            <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter password again"
                    autocomplete="new-password"
            >


            <button
                    type="button"
                    class="show-password"
                    id="showConfirmPasswordButton"
            >

                Show

            </button>


        </div>

    </div>



    <!-- =========================
         SIGNUP BUTTON
         ========================= -->

    <button
            type="button"
            id="signupButton"
    >

        SIGN UP

    </button>



    <div id="message"></div>



    <div class="login-text">

        Already have an account?

        <a href="/login.html">

            Login

        </a>

    </div>


</div>



<script>

    /* =========================
       ELEMENTS
       ========================= */

    const usernameInput =
        document.getElementById(
            "username"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const confirmPasswordInput =
        document.getElementById(
            "confirmPassword"
        );


    const signupButton =
        document.getElementById(
            "signupButton"
        );


    const message =
        document.getElementById(
            "message"
        );



    /* PASSWORD RULES */

    const lengthRule =
        document.getElementById(
            "lengthRule"
        );


    const uppercaseRule =
        document.getElementById(
            "uppercaseRule"
        );


    const lowercaseRule =
        document.getElementById(
            "lowercaseRule"
        );


    const numberRule =
        document.getElementById(
            "numberRule"
        );


    const specialRule =
        document.getElementById(
            "specialRule"
        );



    /* =========================
       STRONG PASSWORD
       ========================= */

    function isStrongPassword(
        password
    ) {return (
            password.length >= 8
            &&
            /[A-Z]/.test(
                password
            )
            &&
            /[a-z]/.test(
                password
            )
            &&
            /\d/.test(
                password
            )
            &&
            /[@#$!%*?&]/.test(
                password
            )
        );
    }



    /* =========================
       LIVE PASSWORD CHECK
       ========================= */

    passwordInput.addEventListener(
        "input",
        function () {

            const password =
                passwordInput.value;


            updateRule(
                lengthRule,
                password.length >= 8
            );


            updateRule(
                uppercaseRule,
                /[A-Z]/.test(
                    password
                )
            );


            updateRule(
                lowercaseRule,
                /[a-z]/.test(
                    password
                )
            );


            updateRule(
                numberRule,
                /\d/.test(
                    password
                )
            );


            updateRule(
                specialRule,
                /[@#$!%*?&]/.test(
                    password
                )
            );


            clearMessage();
        }
    );



    function updateRule(
        element,
        valid
    ) {

        if (valid) {

            element.classList.add(
                "valid"
            );

        } else {

            element.classList.remove(
                "valid"
            );
        }
    }



    /* =========================
       SHOW PASSWORD
       ========================= */

    document
        .getElementById(
            "showPasswordButton"
        )
        .addEventListener(
            "click",
            function () {

                togglePassword(
                    passwordInput,
                    this
                );
            }
        );



    document
        .getElementById(
            "showConfirmPasswordButton"
        )
        .addEventListener(
            "click",
            function () {

                togglePassword(
                    confirmPasswordInput,
                    this
                );
            }
        );



    function togglePassword(
        input,
        button
    ) {

        if (
            input.type === "password"
        ) {

            input.type =
                "text";

            button.textContent =
                "Hide";

        } else {

            input.type =
                "password";

            button.textContent =
                "Show";
        }
    }



    /* =========================
       EMAIL CHECK
       ========================= */

    function isValidEmail(
        email
    ) {

        return (
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(
                    email
                )
        );
    }



    /* =========================
       SIGNUP BUTTON
       ========================= */

    signupButton.addEventListener(
        "click",
        signup
    );



    confirmPasswordInput.addEventListener(
        "keydown",
        function (
            event
        ) {

            if (
                event.key === "Enter"
            ) {

                signup();
            }
        }
    );



    /* =========================
       SIGNUP FUNCTION
       ========================= */

    async function signup() {


        clearMessage();


        const username =
            usernameInput
                .value
                .trim();


        const email =
            emailInput
                .value
                .trim();


        const password =
            passwordInput
                .value;


        const confirmPassword =
            confirmPasswordInput
                .value;



        /* EMPTY */if (
            username === ""
            ||
            email === ""
            ||
            password === ""
            ||
            confirmPassword === ""
        ) {

            showError(
                "Please fill in all fields."
            );

            return;
        }



        /* USERNAME */

        if (
            username.length < 3
        ) {

            showError(
                "Username must be at least 3 characters."
            );

            return;
        }



        /* EMAIL */

        if (
            !isValidEmail(
                email
            )
        ) {

            showError(
                "Please enter a valid email address."
            );

            return;
        }



        /* PASSWORD */

        if (
            !isStrongPassword(
                password
            )
        ) {

            showError(
                "Password must have at least 8 characters, uppercase, lowercase, number and special character."
            );

            return;
        }



        /* CONFIRM PASSWORD */

        if (
            password
            !==
            confirmPassword
        ) {

            showError(
                "Passwords do not match."
            );

            return;
        }



        signupButton.disabled =
            true;


        signupButton.textContent =
            "CREATING ACCOUNT...";



        try {


            const response =
                await fetch(
                    "/api/auth/signup",
                    {

                        method:
                            "POST",


                        headers: {

                            "Content-Type":
                                "application/json"

                        },


                        credentials:
                            "same-origin",


                        body:
                            JSON.stringify(
                                {

                                    username:
                                        username,

                                    email:
                                        email,

                                    password:
                                        password

                                }
                            )

                    }
                );



            const responseText =
                await response.text();



            let data = {};


            try {

                data =
                    JSON.parse(
                        responseText
                    );

            } catch (
                error
            ) {

                console.error(
                    "Server response:",
                    responseText
                );
            }



            if (
                !response.ok
            ) {

                showError(
                    data.message
                    ||
                    "Sign up failed."
                );

                return;
            }



            if (
                data.success
                ===
                true
            ) {


                sessionStorage.setItem(
                    "verifyEmail",
                    email
                );


                showSuccess(
                    data.message
                    ||
                    "Verification code sent."
                );



                setTimeout(
                    function () {


                        window.location.href =
                            "/verifyemail.html?email="
                            +
                            encodeURIComponent(
                                email
                            );


                    },
                    600
                );


            } else {


                showError(
                    data.message
                    ||
                    "Sign up failed."
                );

            }


        } catch (
            error
        ) {console.error(
                error
            );


            showError(
                "Cannot connect to the server."
            );


        } finally {


            signupButton.disabled =
                false;


            signupButton.textContent =
                "SIGN UP";

        }

    }



    /* =========================
       MESSAGE
       ========================= */

    function showError(
        text
    ) {

        message.textContent =
            text;


        message.className =
            "error";
    }



    function showSuccess(
        text
    ) {

        message.textContent =
            text;


        message.className =
            "success";
    }



    function clearMessage() {

        message.textContent =
            "";


        message.className =
            "";
    }

</script>


</body>

</html>
