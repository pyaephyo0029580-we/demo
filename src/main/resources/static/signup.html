<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - MyGaming</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            color: white;

            overflow-x: hidden;

            /* ⭐ Dark Plum & Pink Background */
            background:
                    radial-gradient(
                            circle at 75% 20%,
                            rgba(255, 42, 109, 0.15),
                            transparent 25%
                    ),

                    radial-gradient(
                            circle at 15% 80%,
                            rgba(46, 26, 36, 0.4),
                            transparent 30%
                    ),

                    linear-gradient(
                            145deg,
                            #0A0406 0%,
                            #140A0E 40%,
                            #1A0F14 70%,
                            #0A0406 100%
                    );
        }



        /* ==========================================
           STAR BACKGROUND
        ========================================== */

        body::before {

            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: 0.55;

            background-image:

                    radial-gradient(
                            circle,
                            rgba(255, 255, 255, 0.8) 1px,
                            transparent 1px
                    ),

                    radial-gradient(
                            circle,
                            rgba(255, 42, 109, 0.7) 1px,
                            transparent 1px
                    ),

                    radial-gradient(
                            circle,
                            rgba(255, 255, 255, 0.3) 1px,
                            transparent 1px
                    );


            background-size:
                    95px 95px,
                    145px 145px,
                    55px 55px;


            background-position:
                    10px 15px,
                    40px 70px,
                    15px 30px;
        }



        /* ==========================================
           PLANET
        ========================================== */

        .planet {

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            right: -130px;
            top: -120px;

            pointer-events: none;

            opacity: 0.55;

            /* ⭐ Dark Plum Planet */
            background:
                    radial-gradient(
                            circle at 35% 30%,
                            #FF2A6D,
                            #8A1538 37%,
                            #4A0D1F 67%,
                            #140A0E 100%
                    );


            box-shadow:
                    0 0 90px
                    rgba(255, 42, 109, 0.20);
        }



        /* ==========================================
           PAGE WRAPPER
        ========================================== */

        .page-wrapper {

            position: relative;

            width: 100%;
            max-width: 1000px;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 2;
        }



        /* ==========================================
           CHARACTER
        ========================================== */

        .character-box {

            position: absolute;

            left: 0;
            bottom: 50px;

            width: 270px;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            z-index: 4;
        }


        .character-box::before {

            content: "";

            position: absolute;

            width: 230px;
            height: 80px;

            bottom: -10px;

            border-radius: 50%;

            /* ⭐ Pink Glow */
            background:
                    radial-gradient(
                            ellipse,
                            rgba(255, 42, 109, 0.32),
                            transparent 68%
                    );

            filter: blur(10px);
        }


        .character {

            width: 220px;

            position: relative;

            z-index: 2;

            object-fit: contain;

            /* ⭐ Pink Drop Shadow */
            filter:
                    drop-shadow(
                            0 0 14px
                            rgba(255, 42, 109, 0.55)
                    )
                    drop-shadow(
                            0 0 28px
                            rgba(255, 42, 109, 0.28)
                    );


            animation:
                    characterFloat
                    3.5s
                    ease-in-out
                    infinite;
        }


        @keyframes characterFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }



        /* ==========================================
           SIGNUP CARD
        ========================================== */

        .signup-card {

            position: relative;

            width: 100%;
            max-width: 500px;

            padding:
                    38px
                    42px
                    34px;

            border-radius: 28px;


            /* ⭐ Dark Plum Card Background */
            background:
                    linear-gradient(
                            160deg,
                            #24141C,
                            #140A0E
                    );


            /* ⭐ Neon Pink Border */
            border:
                    1px solid
                    #FF2A6D;


            /* ⭐ Pink Glow Shadow */
            box-shadow:
                    0 0 0 1px
                    rgba(255, 42, 109, 0.13),
                    0 0 38px
                    rgba(255, 42, 109, 0.20),
                    0 30px 80px
                    rgba(0, 0, 0, 0.55);


            backdrop-filter:
                    blur(16px);

            z-index: 3;
        }



        .signup-card::before {

            content: "";

            position: absolute;

            inset: -1px;

            border-radius: 28px;

            padding: 1px;


            /* ⭐ Pink Gradient Border */
            background:
                    linear-gradient(
                            135deg,
                            rgba(255, 42, 109, 0.95),
                            rgba(217, 43, 85, 0.28),
                            rgba(255, 42, 109, 0.85)
                    );


            -webkit-mask:
                    linear-gradient(
                            #fff 0 0
                    )
                    content-box,

                    linear-gradient(
                            #fff 0 0
                    );


            -webkit-mask-composite:
                    xor;

            mask-composite:
                    exclude;


            pointer-events:
                    none;
        }



        /* ==========================================
           MINI CHARACTER
        ========================================== */

        .mini-character {

            position: absolute;

            top: -30px;
            right: 22px;

            width: 65px;

            object-fit: contain;


            /* ⭐ Pink Glow */
            filter:
                    drop-shadow(
                            0 0 11px
                            rgba(255, 42, 109, 0.65)
                    );
        }



        /* ==========================================
           TITLE
        ========================================== */

        .signup-card h1 {

            text-align: center;

            font-size: 36px;
            font-weight: 800;

            color: white;

            margin-bottom: 7px;


            text-shadow:
                    0 0 18px
                    rgba(255, 42, 109, 0.18);
        }


        .subtitle {

            text-align: center;

            /* ⭐ Muted Pink */
            color: #A88B98;

            font-size: 15px;

            margin-bottom: 28px;
        }



        /* ==========================================
           INPUT GROUP
        ========================================== */

        .input-group {

            margin-bottom: 17px;
        }


        .input-group label {

            display: block;

            margin-bottom: 7px;

            color: white;

            font-size: 14px;
            font-weight: 700;
        }



        .input-box {

            position: relative;
        }



        .input-icon {

            position: absolute;

            left: 15px;
            top: 50%;

            transform:
                    translateY(-50%);

            /* ⭐ Soft Pink Icon */
            color: #FF8E9E;

            display: flex;
            justify-content: center;
            align-items: center;

            width: 23px;
            height: 23px;

            pointer-events: none;
        }


        .input-icon svg {

            width: 21px;
            height: 21px;
        }



        .input-group input {

            width: 100%;

            height: 52px;

            padding:
                    0
                    60px
                    0
                    48px;

            border-radius: 11px;

            /* ⭐ Dark Plum Border */
            border:
                    1px solid
                    #3A1F2A;

            outline: none;

            color: white;

            font-size: 15px;


            /* ⭐ Dark Plum Input Background */
            background:
                    linear-gradient(
                            90deg,
                            #2E1A24,
                            #1A0F14
                    );


            transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
        }



        .input-group input::placeholder {

            color: #A88B98;
        }



        .input-group input:focus {

            /* ⭐ Neon Pink Focus */
            border-color:
                    #FF2A6D;


            box-shadow:
                    0 0 0 3px
                    rgba(255, 42, 109, 0.12),
                    0 0 18px
                    rgba(255, 42, 109, 0.20);
        }



        /* ==========================================
           EYE BUTTON
        ========================================== */

        .eye-button {

            position: absolute;

            right: 11px;
            top: 50%;

            transform:
                    translateY(-50%);

            width: 40px;
            height: 40px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: none;

            border-radius: 50%;

            background: transparent;

            /* ⭐ Soft Pink */
            color: #FF8E9E;

            cursor: pointer;

            transition:
                    color 0.2s,
                    background 0.2s,
                    box-shadow 0.2s;
        }


        .eye-button svg {

            width: 24px;
            height: 24px;

            pointer-events: none;
        }


        .eye-button:hover {

            color: white;

            background:
                    rgba(
                            255,
                            42,
                            109,
                            0.12
                    );


            box-shadow:
                    0 0 13px
                    rgba(
                            255,
                            42,
                            109,
                            0.30
                    );
        }



        /* ==========================================
           PASSWORD RULES
        ========================================== */

        .password-rules {

            list-style: none;

            margin:
                    10px
                    0
                    0
                    7px;

            /* ⭐ Muted Pink */
            color: #A88B98;

            font-size: 12px;

            line-height: 1.7;
        }


        .password-rules li::before {

            content: "●";

            margin-right: 9px;

            /* ⭐ Neon Pink Dot */
            color: #FF2A6D;

            text-shadow:
                    0 0 8px
                    #FF2A6D;
        }



        .password-rules li.valid {

            color: #4ade80; /* Keep green for valid */
        }


        .password-rules li.valid::before {

            content: "✓";

            color: #4ade80;
        }



        /* ==========================================
           SIGNUP BUTTON
        ========================================== */

        #signupButton {

            width: 100%;
            height: 55px;

            margin-top: 10px;

            border: none;

            border-radius: 14px;

            color: white;

            font-size: 17px;
            font-weight: 800;

            letter-spacing: 0.8px;

            cursor: pointer;


            /* ⭐ Neon Pink Gradient */
            background:
                    linear-gradient(
                            90deg,
                            #FF2A6D 0%,
                            #D92B55 52%,
                            #FF2A6D 100%
                    );


            box-shadow:
                    0 0 22px
                    rgba(255, 42, 109, 0.40),
                    inset 0 1px 0
                    rgba(255, 255, 255, 0.42);


            transition:
                    transform 0.2s,
                    box-shadow 0.2s,
                    opacity 0.2s;
        }



        #signupButton:hover {

            transform:
                    translateY(-2px);


            box-shadow:
                    0 0 31px
                    rgba(255, 42, 109, 0.58),
                    0 10px 27px
                    rgba(0, 0, 0, 0.30);
        }



        #signupButton:disabled {

            opacity: 0.55;

            cursor:
                    not-allowed;

            transform:
                    none;
        }



        /* ==========================================
           MESSAGE
        ========================================== */

        #message {

            min-height: 20px;

            margin-top: 13px;

            text-align: center;

            font-size: 13px;
            font-weight: 700;
        }


        .error {

            color: #ff6b6b;
        }


        .success {

            color: #4ade80;
        }



        /* ==========================================
           LOGIN LINK
        ========================================== */

        .login-text {

            margin-top: 18px;

            text-align: center;

            color: #A88B98;

            font-size: 14px;
        }


        .login-text a {

            color: #FF2A6D;

            font-weight: 800;

            text-decoration: none;
        }


        .login-text a:hover {

            text-shadow:
                    0 0 10px
                    #FF2A6D;
        }



        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (
                max-width: 850px
        ) {

            .character-box {
                display: none;
            }
        }



        @media (
                max-width: 550px
        ) {

            body {
                padding: 15px;
            }


            .signup-card {
                padding:
                        30px
                        22px
                        27px;

                border-radius:
                        22px;
            }


            .signup-card h1 {
                font-size:
                        30px;
            }


            .planet {
                width:
                        270px;

                height:
                        270px;
            }
        }

    </style>

</head>



<body>


<div class="planet"></div>



<!-- ==========================================
     SIGNUP CARD
=========================================== -->

<div class="signup-card">


    <img
            src="/Image/ghost.png"
            alt=""
            class="mini-character"
    >



    <h1>
        Create Account
    </h1>


    <div class="subtitle">

        Create your MyGaming account

    </div>



    <!-- ======================================
         USERNAME
    ======================================= -->

    <div class="input-group">


        <label for="username">

            Username

        </label>


        <div class="input-box">


                <span class="input-icon">

                    <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                    >

                        <circle
                                cx="12"
                                cy="8"
                                r="4"
                        />

                        <path
                                d="M4 21c0-4 3.6-7 8-7s8 3 8 7"
                        />

                    </svg>

                </span>


            <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    maxlength="30"
                    autocomplete="username"
            >


        </div>

    </div>



    <!-- ======================================
         EMAIL
    ======================================= -->

    <div class="input-group">


        <label for="email">

            Email

        </label>


        <div class="input-box">


                <span class="input-icon">

                    <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                    >

                        <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                        />

                        <path
                                d="M3 7l9 6 9-6"
                        />

                    </svg>

                </span>


            <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    autocomplete="email"
            >


        </div>

    </div>



    <!-- ======================================
         PASSWORD
    ======================================= -->

    <div class="input-group">


        <label for="password">

            Password

        </label>


        <div class="input-box">


                <span class="input-icon">

                    <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                    >

                        <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                        /><path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                    />

                    </svg>

                </span>



            <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="new-password"
            >



            <button
                    type="button"
                    id="showPassword"
                    class="eye-button"
                    aria-label="Show password"
            >


                <!-- EYE OPEN -->

                <svg
                        class="eye-open"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                >

                    <path
                            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                    />

                    <circle
                            cx="12"
                            cy="12"
                            r="3"
                    />

                </svg>



                <!-- EYE CLOSED -->

                <svg
                        class="eye-closed"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        style="display:none;"
                >

                    <path
                            d="M3 3l18 18"
                    />

                    <path
                            d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                    />

                    <path
                            d="M9.9 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17.2 17.2 0 0 1-2.1 3.1"
                    />

                    <path
                            d="M6.2 6.2C3.5 8.1 2 12 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4.1-.8"
                    />

                </svg>


            </button>


        </div>



        <ul class="password-rules">


            <li id="ruleLength">

                At least 8 characters

            </li>


            <li id="ruleUpper">

                At least 1 uppercase letter

            </li>


            <li id="ruleLower">

                At least 1 lowercase letter

            </li>


            <li id="ruleNumber">

                At least 1 number

            </li>


            <li id="ruleSpecial">

                At least 1 special character (@#$!%*?&)

            </li>


        </ul>


    </div>



    <!-- ======================================
         CONFIRM PASSWORD
    ======================================= -->

    <div class="input-group">


        <label for="confirmPassword">

            Confirm Password

        </label>


        <div class="input-box">


                <span class="input-icon">

                    <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                    >

                        <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                        />

                        <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                        />

                    </svg>

                </span><input
                type="password"
                id="confirmPassword"
                placeholder="Enter password again"
                autocomplete="new-password"
        >



            <button
                    type="button"
                    id="showConfirmPassword"
                    class="eye-button"
                    aria-label="Show confirm password"
            >


                <!-- EYE OPEN -->

                <svg
                        class="eye-open"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                >

                    <path
                            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                    />

                    <circle
                            cx="12"
                            cy="12"
                            r="3"
                    />

                </svg>



                <!-- EYE CLOSED -->

                <svg
                        class="eye-closed"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        style="display:none;"
                >

                    <path
                            d="M3 3l18 18"
                    />

                    <path
                            d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                    />

                    <path
                            d="M9.9 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17.2 17.2 0 0 1-2.1 3.1"
                    />

                    <path
                            d="M6.2 6.2C3.5 8.1 2 12 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4.1-.8"
                    />

                </svg>


            </button>


        </div>

    </div>



    <!-- ======================================
         SIGN UP
    ======================================= -->

    <button
            id="signupButton"
            type="button"
    >

        SIGN UP →

    </button>



    <div id="message"></div>



    <div class="login-text">

        Already have an account?

        <a href="/login.html">

            Login

        </a>

    </div>


</div>

</div>



<script>


    /* ==========================================
       ELEMENTS
    ========================================== */


    const usernameInput =
        document.getElementById(
            "username"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const confirmPasswordInput =
        document.getElementById(
            "confirmPassword"
        );


    const signupButton =
        document.getElementById(
            "signupButton"
        );


    const message =
        document.getElementById(
            "message"
        );



    const ruleLength =
        document.getElementById(
            "ruleLength"
        );


    const ruleUpper =
        document.getElementById(
            "ruleUpper"
        );


    const ruleLower =
        document.getElementById(
            "ruleLower"
        );


    const ruleNumber =
        document.getElementById(
            "ruleNumber"
        );


    const ruleSpecial =
        document.getElementById(
            "ruleSpecial"
        );



    /* ==========================================
       STRONG PASSWORD
    ========================================== */


    function isStrongPassword(
        password
    ) {

        return (

            password.length >= 8

            &&/[A-Z]/.test(
                password
            )

            &&

            /[a-z]/.test(
                password
            )

            &&

            /\d/.test(
                password
            )

            &&

            /[@#$!%*?&]/.test(
                password
            )

        );
    }



    /* ==========================================
       PASSWORD RULES
    ========================================== */


    passwordInput.addEventListener(

        "input",

        function () {


            const password =
                passwordInput.value;



            updateRule(

                ruleLength,

                password.length >= 8

            );



            updateRule(

                ruleUpper,

                /[A-Z]/.test(
                    password
                )

            );



            updateRule(

                ruleLower,

                /[a-z]/.test(
                    password
                )

            );



            updateRule(

                ruleNumber,

                /\d/.test(
                    password
                )

            );



            updateRule(

                ruleSpecial,

                /[@#$!%*?&]/.test(
                    password
                )

            );


            clearMessage();

        }

    );



    function updateRule(
        element,
        condition
    ) {

        if (
            condition
        ) {

            element.classList.add(
                "valid"
            );

        } else {

            element.classList.remove(
                "valid"
            );

        }

    }



    /* ==========================================
       EYE BUTTON
    ========================================== */


    document
        .getElementById(
            "showPassword"
        )
        .addEventListener(

            "click",

            function () {

                togglePassword(

                    passwordInput,

                    this

                );

            }

        );



    document
        .getElementById(
            "showConfirmPassword"
        )
        .addEventListener(

            "click",

            function () {

                togglePassword(

                    confirmPasswordInput,

                    this

                );

            }

        );



    function togglePassword(
        input,
        button
    ) {


        const eyeOpen =

            button.querySelector(
                ".eye-open"
            );


        const eyeClosed =

            button.querySelector(
                ".eye-closed"
            );



        if (
            input.type === "password"
        ) {


            input.type =
                "text";


            eyeOpen.style.display =
                "none";


            eyeClosed.style.display =
                "block";


            button.setAttribute(

                "aria-label",

                "Hide password"

            );


        } else {


            input.type =
                "password";


            eyeOpen.style.display =
                "block";


            eyeClosed.style.display =
                "none";


            button.setAttribute(

                "aria-label",

                "Show password"

            );

        }

    }



    /* ==========================================
       EMAIL VALIDATION
    ========================================== */


    function isValidEmail(
        email
    ) {

        return (

            /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(
                    email
                )

        );

    }



    /* ==========================================
       SIGNUP
    ========================================== */


    signupButton.addEventListener(

        "click",

        signup

    );



    confirmPasswordInput.addEventListener(

        "keydown",

        function (
            event
        ) {

            if (
                event.key ===
                "Enter"
            ) {

                signup();

            }

        }

    );



    async function signup() {


        clearMessage();



        const username =

            usernameInput
                .value
                .trim();



        const email =

            emailInput
                .value
                .trim();



        const password =

            passwordInput
                .value;



        const confirmPassword =

            confirmPasswordInput
                .value;



        /* EMPTY */

        if (

            username === ""

            ||

            email === ""

            ||

            password === ""

            ||

            confirmPassword === ""

        ) {


            showError(

                "Please fill in all fields."

            );


            return;

        }



        /* USERNAME */

        if (
            username.length < 3
        ) {


            showError(

                "Username must be at least 3 characters."

            );


            return;

        }



        /* EMAIL */

        if (

            !isValidEmail(
                email
            )

        ) {


            showError(

                "Please enter a valid email address."

            );


            return;

        }



        /* PASSWORD */

        if (

            !isStrongPassword(
                password
            )

        ) {


            showError(

                "Password must contain at least 8 characters, uppercase, lowercase, number and special character."

            );


            return;

        }



        /* CONFIRM PASSWORD */

        if (

            password !==
            confirmPassword

        ) {


            showError(

                "Passwords do not match."

            );


            return;

        }



        signupButton.disabled =
            true;


        signupButton.textContent =
            "CREATING ACCOUNT...";



        try {


            const response =

                await fetch(

                    "/api/auth/signup",

                    {

                        method:
                            "POST",


                        headers: {

                            "Content-Type":
                                "application/json"

                        },


                        credentials:
                            "same-origin",


                        body:

                            JSON.stringify(
                                {

                                    username:
                                        username,

                                    email:
                                        email,

                                    password:
                                        password

                                }
                            )

                    }

                );



            const responseText =

                await response.text();



            let data = {};



            try {


                data =

                    JSON.parse(
                        responseText
                    );


            } catch (
                error
            ) {


                console.error(

                    "Server response:",

                    responseText

                );

            }



            if (
                !response.ok
            ) {


                showError(

                    data.message

                    ||

                    "Sign up failed."

                );


                return;

            }



            if (

                data.success ===
                true

            ) {


                sessionStorage.setItem(

                    "verifyEmail",

                    email

                );



                showSuccess(

                    data.message

                    ||

                    "Verification code sent."

                );

                setTimeout(

                    function () {


                        window.location.href =

                            "/verifyemail.html?email="

                            +

                            encodeURIComponent(
                                email
                            );


                    },

                    600

                );


            } else {


                showError(

                    data.message

                    ||

                    "Sign up failed."

                );

            }



        } catch (
            error
        ) {


            console.error(
                error
            );


            showError(

                "Cannot connect to the server."

            );


        } finally {


            signupButton.disabled =
                false;


            signupButton.textContent =
                "SIGN UP →";

        }

    }



    /* ==========================================
       MESSAGE
    ========================================== */


    function showError(
        text
    ) {


        message.textContent =
            text;


        message.className =
            "error";

    }



    function showSuccess(
        text
    ) {


        message.textContent =
            text;


        message.className =
            "success";

    }



    function clearMessage() {


        message.textContent =
            "";


        message.className =
            "";

    }


</script>
