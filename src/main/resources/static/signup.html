<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MyGaming</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f5f9;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #555;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .show-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .password-rules {
            margin: 8px 0 0;
            padding-left: 20px;
            color: #777;
            font-size: 12px;
            line-height: 1.7;
        }

        .valid {
            color: #159447;
            font-weight: bold;
        }

        #signupButton {
            width: 100%;
            height: 50px;
            margin-top: 8px;
            border: none;
            border-radius: 11px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #signupButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            min-height: 22px;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .error {
            color: #d93025;
        }

        .success {
            color: #159447;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Create Account</h1>
    <div class="subtitle">Create your MyGaming account</div>

    <div class="input-group">
        <label for="username">Username</label>

        <input
                id="username"
                type="text"
                placeholder="Enter username"
                maxlength="30"
                autocomplete="username"
        >
    </div>

    <div class="input-group">
        <label for="email">Email</label>

        <input
                id="email"
                type="email"
                placeholder="Enter email"
                autocomplete="email"
        >
    </div>

    <div class="input-group">
        <label for="password">Password</label>

        <div class="password-wrapper"><input
                id="password"
                type="password"
                placeholder="Enter password"
                autocomplete="new-password"
        >

            <button
                    id="showPassword"
                    class="show-btn"
                    type="button"
            >
                Show
            </button>

        </div>

        <ul class="password-rules">
            <li id="ruleLength">At least 8 characters</li>
            <li id="ruleUpper">At least 1 uppercase letter</li>
            <li id="ruleLower">At least 1 lowercase letter</li>
            <li id="ruleNumber">At least 1 number</li>
            <li id="ruleSpecial">At least 1 special character (@#$!%*?&)</li>
        </ul>
    </div>

    <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>

        <div class="password-wrapper">

            <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Enter password again"
                    autocomplete="new-password"
            >

            <button
                    id="showConfirmPassword"
                    class="show-btn"
                    type="button"
            >
                Show
            </button>

        </div>
    </div>

    <button id="signupButton" type="button">
        Sign Up
    </button>

    <div id="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="/login.html">Login</a>
    </div>

</div>


<script>

    const usernameInput =
        document.getElementById("username");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const signupButton =
        document.getElementById("signupButton");

    const message =
        document.getElementById("message");


    const ruleLength =
        document.getElementById("ruleLength");

    const ruleUpper =
        document.getElementById("ruleUpper");

    const ruleLower =
        document.getElementById("ruleLower");

    const ruleNumber =
        document.getElementById("ruleNumber");

    const ruleSpecial =
        document.getElementById("ruleSpecial");


    function isStrongPassword(password) {

        return (
            password.length >= 8 &&
            /[A-Z]/.test(password) &&
            /[a-z]/.test(password) &&
            /\d/.test(password) &&
            /[@#$!%*?&]/.test(password)
        );
    }


    function updateRule(element, condition) {

        if (condition) {
            element.classList.add("valid");
        } else {
            element.classList.remove("valid");
        }
    }


    passwordInput.addEventListener("input", function () {

        const password = passwordInput.value;

        updateRule(
            ruleLength,
            password.length >= 8
        );

        updateRule(
            ruleUpper,
            /[A-Z]/.test(password)
        );

        updateRule(
            ruleLower,
            /[a-z]/.test(password)
        );

        updateRule(
            ruleNumber,
            /\d/.test(password)
        );

        updateRule(
            ruleSpecial,
            /[@#$!%*?&]/.test(password)
        );

        clearMessage();
    });


    document
        .getElementById("showPassword")
        .addEventListener("click", function () {

            togglePassword(
                passwordInput,
                this
            );
        });


    document
        .getElementById("showConfirmPassword")
        .addEventListener("click", function () {

            togglePassword(
                confirmPasswordInput,
                this
            );
        });


    function togglePassword(input, button) {

        if (input.type === "password") {

            input.type = "text";
            button.textContent = "Hide";

        } else {input.type = "password";
            button.textContent = "Show";
        }
    }


    function isValidEmail(email) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }


    signupButton.addEventListener(
        "click",
        signup
    );


    confirmPasswordInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {
                signup();
            }
        }
    );


    async function signup() {

        clearMessage();

        const username =
            usernameInput.value.trim();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        if (
            username === "" ||
            email === "" ||
            password === "" ||
            confirmPassword === ""
        ) {

            showError(
                "Please fill in all fields."
            );

            return;
        }


        if (username.length < 3) {

            showError(
                "Username must be at least 3 characters."
            );

            return;
        }


        if (!isValidEmail(email)) {

            showError(
                "Please enter a valid email address."
            );

            return;
        }


        if (!isStrongPassword(password)) {

            showError(
                "Password must contain at least 8 characters, uppercase, lowercase, number and special character."
            );

            return;
        }


        if (password !== confirmPassword) {

            showError(
                "Passwords do not match."
            );

            return;
        }


        signupButton.disabled = true;
        signupButton.textContent =
            "Creating Account...";


        try {

            const response =
                await fetch(
                    "/api/auth/signup",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "same-origin",

                        body: JSON.stringify({
                            username: username,
                            email: email,
                            password: password
                        })
                    }
                );


            const responseText =
                await response.text();


            let data = {};

            try {
                data = JSON.parse(responseText);
            } catch (e) {
                console.error(
                    "Server response:",
                    responseText
                );
            }


            if (!response.ok) {

                showError(
                    data.message ||
                    "Sign up failed."
                );

                return;
            }


            if (data.success === true) {

                sessionStorage.setItem(
                    "verifyEmail",
                    email
                );


                showSuccess(
                    data.message ||
                    "Verification code sent."
                );


                setTimeout(function () {

                    window.location.href =
                        "/verifyemail.html?email="
                        +
                        encodeURIComponent(email);

                }, 600);

            } else {

                showError(
                    data.message ||
                    "Sign up failed."
                );
            }


        } catch (error) {

            console.error(error);

            showError(
                "Cannot connect to the server."
            );

        } finally {

            signupButton.disabled = false;

            signupButton.textContent =
                "Sign Up";
        }
    }


    function showError(text) {message.textContent = text;
        message.className = "error";
    }


    function showSuccess(text) {

        message.textContent = text;
        message.className = "success";
    }


    function clearMessage() {

        message.textContent = "";
        message.className = "";
    }

</script>

</body>
</html>
