<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Play - My Online Game</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        /* ==========================================
           BODY
           ========================================== */
        body {
            background: radial-gradient(circle at center, #24141C, #140A0E);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 1000px;
            height: 650px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==========================================
           BACK BUTTON
           ========================================== */
        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            background-color: #2E1A24;
            color: #A88B98;
            border: 1px solid #3A1F2A;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background-color: #3A1F2A;
            color: #ffffff;
            border-color: #FF2A6D;
            box-shadow: 0 0 10px rgba(255, 42, 109, 0.3);
        }

        /* ==========================================
           CENTER BOX (SELECT GAME MODE)
           ========================================== */
        .center-box {
            background-color: #1A0F14;
            border: 1px solid #3A1F2A;
            border-radius: 12px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 350px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 42, 109, 0.1);
        }

        h2 {
            margin: 0 0 10px 0;
            color: #FF2A6D;
            text-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
        }

        /* ==========================================
           ACTION BUTTONS
           ========================================== */
        .action-btn {
            width: 250px;
            height: 50px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .btn-create {
            background: linear-gradient(135deg, #FF2A6D, #D92B55);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 42, 109, 0.4);
        }

        .btn-create:hover {
            box-shadow: 0 6px 20px rgba(255, 42, 109, 0.6);
        }

        .btn-join {
            background: linear-gradient(135deg, #31c78b, #28a745); /* Green gradient for Join */
            color: white;
            box-shadow: 0 4px 15px rgba(49, 199, 139, 0.4);
        }

        .btn-join:hover {
            box-shadow: 0 6px 20px rgba(49, 199, 139, 0.6);
        }

        /* ==========================================
           MODAL (JOIN ROOM)
           ========================================== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 10, 14, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #1A0F14;
            border: 2px solid #FF2A6D;
            border-radius: 12px;
            padding: 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.3);
            animation: modalPop 0.2s ease;
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-box h3 {
            margin-top: 0;
            color: #FF2A6D;
        }

        /* ==========================================
           INPUT
           ========================================== */
        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #3A1F2A;
            background: #2E1A24;
            color: white;
            text-align: center;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #FF2A6D;
            box-shadow: 0 0 10px rgba(255, 42, 109, 0.3);
        }

        /* ==========================================
           MODAL BUTTONS
           ========================================== */
        .modal-btn {
            width: 120px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: 0.2s;
        }

        .join-confirm {
            background: linear-gradient(135deg, #FF2A6D, #D92B55);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 42, 109, 0.3);
        }

        .join-confirm:hover {
            box-shadow: 0 6px 15px rgba(255, 42, 109, 0.5);
        }

        .cancel-btn {
            background: #3A1F2A;
            color: #A88B98;
            border: 1px solid #2E1A24;
        }

        .cancel-btn:hover {
            background: #2E1A24;
            color: white;
        }

        /* ==========================================
           STATUS TEXT
           ========================================== */
        #status {
            margin-top: 10px;
            color: #FF2A6D;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Back to Home Button ပြင်ဆင်ထားသည် -->
    <button class="back-btn" onclick="goBackToHome()">
        &lt; Back to Home
    </button>

    <div class="center-box">

        <h2>SELECT GAME MODE</h2>

        <button class="action-btn btn-create"
                onclick="createRoom()">
            CREATE ROOM
        </button>

        <button class="action-btn btn-join"
                onclick="openJoinModal()">
            JOIN ROOM
        </button>

    </div>
</div>


<!-- JOIN ROOM MODAL -->

<div id="joinModal" class="modal">

    <div class="modal-box">

        <h3>JOIN ROOM</h3>

        <p>Enter Room Code</p>

        <input
                type="text"
                id="roomCodeInput"
                placeholder="ABC123"
                maxlength="6"
        >

        <br>

        <button class="modal-btn join-confirm"
                onclick="joinRoom()">
            JOIN
        </button>

        <button class="modal-btn cancel-btn"
                onclick="closeJoinModal()">
            CANCEL
        </button>

        <div id="status"></div>

    </div>

</div>


<script>

    let stompClient = null;


    // ==========================================
    // GET USERNAME
    // ==========================================

   function getUsername() {
        const params = new URLSearchParams(window.location.search);
        const urlUsername = params.get("user");

        if (urlUsername && urlUsername.trim() !== "") {
            const username = urlUsername.trim();
            localStorage.setItem("username", username);
            return username;
        }

        const username = localStorage.getItem("username");

        if (!username || username.trim() === "") {
            alert("Please login first.");
            return null;
        }

        return username.trim();
    }


    // ==========================================
    // BACK TO HOME FUNCTION (Added)
    // ==========================================
    function goBackToHome() {
        const username = getUsername() || "Player";
        const coins = sessionStorage.getItem("coins") || localStorage.getItem("coins") || "0";
        window.location.href = `/homepage.html?user=${encodeURIComponent(username)}&coins=${coins}`;
    }


    // ==========================================
    // CONNECT WEBSOCKET
    // ==========================================

    function connectSocket(callback) {

        const socket = new SockJS("/game-websocket");

        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {

            console.log("Connected: " + frame);

            if (callback) {
                callback();
            }

        }, function(error) {

            console.error("WebSocket error:", error);

            alert("Could not connect to game server.");

        });
    }


    // ==========================================
    // CREATE ROOM
    // ==========================================

    function createRoom() {

        const username = getUsername();

        if (!username) {
            return;
        }

        connectSocket(function() {

            stompClient.subscribe(
                "/topic/room-created/" + username,
                function(message) {

                    const data = JSON.parse(message.body);

                    console.log("Room Created:", data);

                    if (data.type === "ROOM_CREATED") {

                        sessionStorage.setItem(
                            "roomCode",
                            data.roomCode
                        );

                        sessionStorage.setItem(
                            "host",
                            data.host
                        );

                        sessionStorage.setItem(
                            "username",
                            username
                        );

                        window.location.href = "lobby.html";
                    }
                }
            );


            stompClient.send(
                "/app/create-room",
                {},
                JSON.stringify({
                    username: username
                })
            );

        });
    }


    // ==========================================
    // OPEN JOIN MODAL
    // ==========================================

    function openJoinModal() {

        const username = getUsername();

        if (!username) {
            return;
        }

        document.getElementById("joinModal").style.display = "flex";

        document.getElementById("roomCodeInput").focus();
    }


    // ==========================================
    // CLOSE JOIN MODAL
    // ==========================================

    function closeJoinModal() {

        document.getElementById("joinModal").style.display = "none";

        document.getElementById("status").innerText = "";

        document.getElementById("roomCodeInput").value = "";
    }


    // ==========================================
    // JOIN ROOM
    // ==========================================

    function joinRoom() {

        const username = getUsername();

        if (!username) {
            return;
        }

        const roomCode =
            document
                .getElementById("roomCodeInput")
                .value
                .trim()
                .toUpperCase();


        if (!roomCode) {

            document.getElementById("status").innerText =
                "Please enter a room code.";

            return;
        }


        if (roomCode.length !== 6) {

            document.getElementById("status").innerText =
                "Room code must be 6 characters.";

            return;
        }


        connectSocket(function() {

            // ==================================
            // ROOM JOINED
            // ==================================

            stompClient.subscribe(
                "/topic/room-joined/" + username,
                function(message) {

                    const data = JSON.parse(message.body);

                    console.log("Room Joined:", data);


                    if (data.type === "ROOM_JOINED") {

                        sessionStorage.setItem(
                            "roomCode",
                            data.roomCode
                        );

                        sessionStorage.setItem(
                            "host",
                            data.host
                        );

                        sessionStorage.setItem(
                            "username",
                            username
                        );

                        window.location.href = "lobby.html";
                    }
                }
            );


            // ==================================
            // ROOM ERROR
            // ==================================

            stompClient.subscribe(
                "/topic/room-error/" + username,
                function(message) {

                    const data = JSON.parse(message.body);

                    console.log("Room Error:", data);

                    document.getElementById("status").innerText =
                        data.message || "Unable to join room.";
                }
            );


            // ==================================
            // SEND JOIN REQUEST
            // ==================================

            stompClient.send(
                "/app/join-room",
                {},
                JSON.stringify({
                    username: username,
                    roomCode: roomCode
                })
            );

        });
    }


    // ==========================================
    // ENTER KEY
    // ==========================================

    document
        .getElementById("roomCodeInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                joinRoom();
            }

        });

</script>

</body>
</html>
