<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dynamic TMX Map - Player Movement</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;----
        }
        canvas {
            border: 2px solid #555;
            background: #000;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 1. Tileset Image နှင့် Player Image များကို Load လုပ်ခြင်း
    const tilesetImg = new Image();
    tilesetImg.src = '/Map/Hospital.tsx'; // သို့မဟုတ် Tileset ပုံဖိုင် /Map/hospital_tiles.png (Tileset ရဲ့ ပုံဖိုင်လမ်းကြောင်း ပေးပါ)

    const playerImg = new Image();
    playerImg.src = '/Map/jellyb-removebg-preview.png';

    // Player Data
    const player = {
        x: 384, y: 284,
        width: 48, height: 48,
        speed: 4,
        frameX: 0, frameY: 0,
        spriteWidth: 64, spriteHeight: 64,
        moving: false
    };

    let mapData = null;
    let mapWidth = 0;
    let mapHeight = 0;
    let tileSize = 32;

    // 2. .tmx XML ဖိုင်ကို Fetch လုပ်ပြီး Map Data ဖတ်ယူခြင်း
    fetch('/Map/hospital.tmx')
        .then(response => response.text())
        .then(xmlString => {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, "text/xml");

            const mapTag = xmlDoc.getElementsByTagName("map")[0];
            mapWidth = parseInt(mapTag.getAttribute("width"));
            mapHeight = parseInt(mapTag.getAttribute("height"));
            tileSize = parseInt(mapTag.getAttribute("tilewidth")) || 32;

            // Layer ထဲက Tile Data (CSV/GID) များကို ယူခြင်း
            const layerData = xmlDoc.getElementsByTagName("data")[0].textContent.trim();
            mapData = layerData.split(',').map(id => parseInt(id.trim()));

            // Map Data ရရှိပါက Game Loop စတင်မည်
            gameLoop();
        })
        .catch(err => console.error(".tmx Map ဖတ်၍ မရပါ:", err));

    // Keyboard Control
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => delete keys[e.key]);

    function updatePlayer() {
        player.moving = false;
        if (keys['ArrowUp']  keys['w']  keys['W']) { player.y -= player.speed; player.frameY = 3; player.moving = true; }
        if (keys['ArrowDown']  keys['s']  keys['S']) { player.y += player.speed; player.frameY = 0; player.moving = true; }
        if (keys['ArrowLeft']  keys['a']  keys['A']) { player.x -= player.speed; player.frameY = 1; player.moving = true; }
        if (keys['ArrowRight']  keys['d']  keys['D']) { player.x += player.speed; player.frameY = 2; player.moving = true; }
    }

    // 3. Dynamic Tiled Map ကို Canvas ပေါ်တွင် Tile တစ်ကွက်ချင်း Render ဆွဲပေးခြင်း
    function drawMap() {
        if (!mapData) return;

        for (let i = 0; i < mapData.length; i++) {
            const tileId = mapData[i];
            if (tileId > 0) { // Tile ID 0 မဟုတ်ပါက ရေးဆွဲမည်
                const col = i % mapWidth;
                const row = Math.floor(i / mapWidth);

                const x = col * tileSize;
                const y = row * tileSize;

                // Tileset Image မှ သက်ဆိုင်ရာ Tile အကွက်ကို ဖြတ်ယူခြင်း
                const tilesetCols = Math.floor(tilesetImg.width / tileSize) || 1;
                const tileIndex = tileId - 1; // GID ကို Index ပြောင်းခြင်း
                const sx = (tileIndex % tilesetCols) * tileSize;
                const sy = Math.floor(tileIndex / tilesetCols) * tileSize;

                ctx.drawImage(tilesetImg, sx, sy, tileSize, tileSize, x, y, tileSize, tileSize);
            }
        }
    }

    function drawPlayer() {
        if (playerImg.complete) {ctx.drawImage(
                playerImg,
                player.frameX * player.spriteWidth, player.frameY * player.spriteHeight,
                player.spriteWidth, player.spriteHeight,
                player.x, player.y, player.width, player.height
            );
        }
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawMap();    // Dynamic .tmx Map ဆွဲပေးမည်
        updatePlayer();
        drawPlayer(); // Player ဆွဲပေးမည်
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
