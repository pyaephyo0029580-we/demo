<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us - Inventory</title>
    <link rel="stylesheet" href="inventory.css">
</head>
<body class="inventory-body">

<!-- ===== TOP BAR ===== -->
<div class="inv-topbar">
    <button class="inv-back-btn" onclick="goBack()">✕</button>
    <span class="inv-nav-tab active" onclick="showTab('colors', this)">🎨 COLORS</span>
    <span class="inv-nav-tab" onclick="showTab('hats', this)">🎩 HAT</span>
    <span class="inv-nav-tab" onclick="showTab('skin', this)">👕 SKIN</span>
    <span class="inv-nav-tab" onclick="showTab('visor', this)">🥽 VISOR</span>
    <span class="inv-nav-tab" onclick="showTab('pet', this)">🐾 PET</span>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="inv-content">

    <!-- LEFT: Item Selection -->
    <div class="inv-left">
        <div id="tabContent"></div>
    </div>

    <!-- RIGHT: Character Preview -->
    <div class="inv-right">
        <div class="inv-char-pane">
            <img id="characterImg"
                 src="Image/kaonashi-removebg-preview.png"
                 class="inv-character"
                 alt="Character">
            <img id="hatImg" class="inv-hat" style="display:none;" alt="Hat">
        </div>
        <div class="inv-item-name" id="itemName">RED</div>
        <div class="inv-equipped">EQUIPPED</div>
    </div>

</div>

<script>
    // ============================================
    // URL Parameters
    // ============================================
    const params = new URLSearchParams(window.location.search);
    const roomCode = params.get('room') || 'DEFAULT';
    const username = params.get('user') || 'Player';

    // ============================================
    // DATA
    // ============================================
    const COLORS = [
        ["Red", "#C51111"], ["Blue", "#132ED1"], ["Green", "#117F2D"],
        ["Pink", "#ED54BA"], ["Orange", "#EF7D0D"], ["Yellow", "#F5F557"],
        ["Black", "#3F474E"], ["White", "#D6E0F0"], ["Purple", "#6B2FBB"],
        ["Brown", "#71491E"], ["Cyan", "#38FEDC"], ["Lime", "#50EF39"]
    ];

    const HATS = [
        ["No Hat", null, 0],
        ["Bird", "Image/Hats/Bird.png", -20],
        ["Frederick", "Image/Hats/Frederick.png", -20],
        ["Hatty", "Image/Hats/Hatty.png", -20],
        ["Headsług", "Image/Hats/Headsług.png", -20],
        ["Inugami", "Image/Hats/Inugami.png", -20],
        ["Kid", "Image/Hats/Kid.png", -20],
        ["Lilac", "Image/Hats/Lilac.png", -20],
        ["Lufi", "Image/Hats/Lufi.png", -20]
    ];

    let currentColor = "Red";
    let currentColorHex = "#C51111";
    let currentHat = "No Hat";
    let originalImageSrc = "Image/kaonashi-removebg-preview.png";

    // ============================================
    // Tab Switching
    // ============================================
    function showTab(tab, el) {
        document.querySelectorAll('.inv-nav-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        if (tab === 'colors') renderColors();
        else if (tab === 'hats') renderHats();
        else renderPlaceholder(tab.toUpperCase());
    }

    // ============================================
    // COLORS Tab
    // ============================================
    function renderColors() {
        let html = '<h2 class="inv-section-title">COLORS</h2><div class="inv-color-grid">';
        COLORS.forEach(([name, hex]) => {
            const sel = (name === currentColor) ? 'selected' : '';
            html += '<div class="inv-color-btn ' + sel + '" ' +
                    'style="background:' + hex + ';" ' +
                    'onclick="pickColor(\'' + name + '\',\'' + hex + '\')"></div>';
        });
        html += '</div>';
        document.getElementById('tabContent').innerHTML = html;
    }

    function pickColor(name, hex) {
        currentColor = name;
        currentColorHex = hex;
        document.getElementById('itemName').innerText = name.toUpperCase();
        applyColor(hex);
    }

    // ============================================
    // Color Tinting (Canvas API)
    // ============================================
    function applyColor(hex) {
        const img = document.getElementById('characterImg');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const temp = new Image();
        temp.crossOrigin = 'anonymous';
        temp.src = originalImageSrc;

        temp.onload = () => {
            canvas.width = temp.width;
            canvas.height = temp.height;
            ctx.drawImage(temp, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const rgb = hexToRgb(hex);

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (a < 25) continue;

                const brightness = (r + g + b) / 3;
                const isFace = r > 153 && g > 127 && (r - b) > 5;
                const isDark = brightness < 115;

                if (!isFace && !isDark) {
                    data[i] = rgb.r;
                    data[i+1] = rgb.g;
                    data[i+2] = rgb.b;
                }
            }

            ctx.putImageData(imgData, 0, 0);
            img.src = canvas.toDataURL();
        };

        temp.onerror = () => {
            console.error('❌ ပုံ load မဖြစ်ပါ:', originalImageSrc);
        };
    }

    function hexToRgb(hex) {
        const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return m ? {
            r: parseInt(m[1], 16),
            g: parseInt(m[2], 16),
            b: parseInt(m[3], 16)
        } : { r: 255, g: 0, b: 0 };
    }

    // ============================================
    // HATS Tab
    // ============================================
    function renderHats() {
        let html = '<h2 class="inv-section-title">HATS</h2><div class="inv-hat-grid">';
        HATS.forEach(([name, path, offset]) => {
            const sel = (name === currentHat) ? 'selected' : '';
            if (path) {
                html += '<div class="inv-hat-btn ' + sel + '" ' +
                        'onclick="pickHat(\'' + name + '\',\'' + path + '\',' + offset + ')">' +
                        '<img src="' + path + '" alt="' + name + '"></div>';
            } else {
                html += '<div class="inv-hat-btn ' + sel + '" ' +
                        'onclick="pickHat(\'' + name + '\',null,0)">∅</div>';
            }
        });
        html += '</div>';
        document.getElementById('tabContent').innerHTML = html;
    }

    function pickHat(name, path, offset) {
        currentHat = name;
        document.getElementById('itemName').innerText = name.toUpperCase();
        const hatImg = document.getElementById('hatImg');
        if (path) {
            hatImg.src = path;
            hatImg.style.display = 'block';
            hatImg.style.transform = 'translateY(' + offset + 'px)';
        } else {
            hatImg.style.display = 'none';
        }
    }

    // ============================================
    // Placeholder
    // ============================================
    function renderPlaceholder(name) {
        document.getElementById('tabContent').innerHTML =
            '<h2 class="inv-section-title">' + name + '</h2>' +
            '<p style="color:#b0b0c0; padding: 20px 0;">🚧 ' + name + ' items coming soon...</p>';
    }

    // ============================================
    // Navigation
    // ============================================
    function goBack() {
        window.location.href = 'homepage.html?user=' + encodeURIComponent(username);
    }

    // ============================================
    // INIT
    // ============================================
    window.onload = function() {
        renderColors();
        // Default color ကို apply လုပ်
        setTimeout(() => applyColor(currentColorHex), 100);
    };
</script>

</body>
</html>
