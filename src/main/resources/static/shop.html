<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop - My Online Game</title>
    <style>

        /* =========================================
           SHOP.CSS (Dark Plum & Neon Pink Theme)
        ========================================= */

        body {
            background-color: #140A0E; /* Deep dark plum */
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .shop-container {
            width: 100vw;
            height: 100vh;
            background-color: #1A0F14;
            border: 1px solid #2E1A24;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Top Bar / Tabs */
        .top-bar {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #3A1F2A;
            background-color: #24141C;
        }

        .back-btn {
            background: none;
            border: none;
            color: #A88B98;
            font-size: 20px;
            cursor: pointer;
            margin-right: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .back-btn:hover { color: #FF2A6D; transform: scale(1.1); }

        .tab-btn {
            background-color: #2E1A24;
            color: #A88B98;
            border: 1px solid #3A1F2A;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background-color: #3A1F2A;
            color: white;
        }

        .tab-btn.active {
            background-color: #2E1A24;
            color: #FF2A6D;
            border: 1px solid #FF2A6D;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.4);
        }

        .currency-display {
            margin-left: auto;
            background: #2E1A24;
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid #3A1F2A;
            color: #FF2A6D;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 42, 109, 0.2);
        }

        /* Main Content Layout */
        .content-area {
            display: flex;
            flex: 1;
            height: calc(100vh - 65px);
        }

        /* Left Side: Items Grid */
        .left-panel {
            width: 60%;
            padding: 30px;
            overflow-y: auto;
            border-right: 1px solid #2E1A24;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            align-content: start;
        }

        .item-card {
            background-color: #2E1A24;
            border-radius: 10px;
            height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .item-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.6);
            border-color: #A88B98;
        }

        .item-card.selected {
            border-color: #FF2A6D;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 42, 109, 0.5);
        }

        .item-preview-img {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
        }

        .item-preview-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .price-tag {
            background-color: #1A0F14;
            color: #FF2A6D;
            width: 100%;
            border-radius: 6px;
            padding: 4px 0;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: 1px solid #3A1F2A;
        }

        /* Right Side: Big Preview & Buy Panel */
        .right-panel {
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #1A0F14;
            position: relative;
            overflow: hidden;
        }

        /* Glowing background effect */
        .right-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 42, 109, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Blank Photo Template for Big Preview */
        .preview-box {
            width: 180px;
            height: 180px;
            background-color: #2E1A24;
            border: 1px solid #3A1F2A;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 2;
        }

        .preview-box img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        .item-name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: white;
            text-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
            z-index: 2;
        }

        .item-price {
            color: #FF2A6D;
            font-size: 20px;
            margin-bottom: 25px;
            font-weight: bold;
            z-index: 2;
        }

        .buy-btn {
            background: linear-gradient(135deg, #FF2A6D, #D92B55);
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 42, 109, 0.4);
            transition: all 0.3s;
            z-index: 2;
        }
        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 42, 109, 0.6);
        }

        /* Scrollbar */
        .left-panel::-webkit-scrollbar {
            width: 8px;
        }
        .left-panel::-webkit-scrollbar-track {
            background: #140A0E;
        }
        .left-panel::-webkit-scrollbar-thumb {
            background: #3A1F2A;
            border-radius: 4px;
        }
        .left-panel::-webkit-scrollbar-thumb:hover {
            background: #FF2A6D;
        }

    </style>
</head>
<body>

<div class="shop-container">
    <!-- Top Bar with Back Button & Tabs -->
    <div class="top-bar">
        <button class="back-btn" onclick="goBack()" title="Back to Homepage">✕</button>
        <button class="tab-btn active" onclick="switchCategory('hats')">Hats</button>
        <!-- ⭐ Skins Button ကို ဖျက်လိုက်ပါပြီ -->
        <div class="currency-display" id="coinDisplay">🪙 0</div>
    </div>

    <!-- Main Content Area -->
    <div class="content-area">
        <!-- Left Panel: Grid with Blank Templates -->
        <div class="left-panel" id="shopGrid"></div>

        <!-- Right Panel: Blank Photo Preview & Buy Option -->
        <div class="right-panel">
            <div class="preview-box" id="previewContainer">
                <img id="previewImage" src="" alt="Preview" onerror="this.outerHTML='<span style=\'font-size:60px;\'>📦</span>'">
            </div>
            <div class="item-name" id="itemName">Select Item</div>
            <div class="item-price" id="itemPrice">🪙 500</div>
            <button class="buy-btn" onclick="buyItem()">BUY</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('user') || 'Player';

    // ⭐ Database ကနေ Coin ကို လှမ်းယူမယ်
    let coins = 0;

    async function fetchUserCoins() {
        try {
            const response = await fetch(`/api/coin/balance?username=${encodeURIComponent(username)}`);
            const data = await response.json();
            coins = data.coins;
            document.getElementById('coinDisplay').innerText = `🪙 ${coins}`;
        } catch (error) {
            console.error("Error fetching coins:", error);
            coins = parseInt(urlParams.get('coins') || '0');
            document.getElementById('coinDisplay').innerText = `🪙 ${coins}`;
        }
    }

    let shopItems = { hats: [], skins: [] };
    let currentCategory = 'hats';
    let selectedItem = null;

    async function fetchShopItems() {
        try {
            const response = await fetch('/api/items/shop');
            const data = await response.json();

            shopItems.hats = data.filter(item => item.category === 'HAT');
            shopItems.skins = data.filter(item => item.category === 'SKIN');

            if (shopItems[currentCategory].length > 0) {
                selectedItem = shopItems[currentCategory][0];
            }

            renderShopGrid();
            updatePreview();
        } catch (error) {
            console.error("Error fetching shop items:", error);
        }
    }

    function renderShopGrid() {
        const grid = document.getElementById('shopGrid');
        grid.innerHTML = '';

        if (!selectedItem) return;

        shopItems[currentCategory].forEach(item => {
            const card = document.createElement('div');
            card.className = `item-card ${selectedItem.id === item.id ? 'selected' : ''}`;

            // ⭐ Cache မဖမ်းအောင် ?t=... လေးထည့်ထားပါတယ်
            card.innerHTML = `
                <div class="item-preview-img">
                    <img src="${item.imagePath}?t=${new Date().getTime()}" alt="${item.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\\'font-size:35px;\\'>📦</span>'">
                </div>
                <div class="price-tag">
                    <span>🪙</span> ${item.price}
                </div>
            `;

            card.onclick = () => {
                selectedItem = item;
                renderShopGrid();
                updatePreview();
            };

            grid.appendChild(card);
        });
    }

    function updatePreview() {
        if (!selectedItem) return;

        const previewContainer = document.getElementById('previewContainer');

        // ⭐ ဒီနေရာမှာ စာလုံးပေါင်း မှားနေတာ (previepreviewContainer) ကို ပြင်ပေးလိုက်ပါတယ်
        previewContainer.innerHTML = `<img id="previewImage" src="${selectedItem.imagePath}?t=${new Date().getTime()}" alt="${selectedItem.name}" onerror="this.outerHTML='<span style=\\'font-size:60px;\\'>📦</span>'">`;

        document.getElementById('itemName').innerText = selectedItem.name;
        document.getElementById('itemPrice').innerText = `🪙 ${selectedItem.price}`;
    }

    function switchCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        if (shopItems[category].length > 0) {
            selectedItem = shopItems[category][0];
        } else {
            selectedItem = null;
        }

        renderShopGrid();
        updatePreview();
    }

    async function buyItem() {
        if (!selectedItem) {
            alert("Please select an item first!");
            return;
        }

        try {
            const response = await fetch(
                `/api/buy?username=${encodeURIComponent(username)}&itemId=${selectedItem.id}`,
                { method: 'POST' }
            );

            const result = await response.text();

            if (response.ok) {
                await fetchUserCoins();
                alert(`✅ ${selectedItem.name} ကို ဝယ်လိုက်ပါပြီ!`);
            } else {
                alert(`❌ ${result}`);
            }
        } catch (error) {
            console.error("Buy error:", error);
            alert("Error occurred while buying!");
        }
    }

    function goBack() {
        window.location.href = `/homepage.html?user=${encodeURIComponent(username)}&coins=${coins}`;
    }

    fetchUserCoins();
    fetchShopItems();

</script>

</body>
</html>
