<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Online Game - Home Page</title>

    <link rel="stylesheet"
          href="homepage.css">
</head>


<body class="home-game-body">

<div class="home-game-container">


    <!-- ===================================== -->
    <!-- TOP BAR -->
    <!-- ===================================== -->

    <div class="home-top-bar">

        <div class="player-info">

            <span class="player-icon">
                ●
            </span>

            <span
                    class="player-name"
                    id="playerName">
                Player
            </span>

        </div>


        <div class="top-bar-spacer"></div>


        <div class="coin-area">

            <span class="coin-icon">
                ●
            </span>

            <span
                    class="coin-text"
                    id="coinLabel">
                0
            </span>

        </div>


        <!-- FRIENDS -->
        <a
                id="friendsLink"
                class="friends-button"
                href="/friends.html">

            FRIENDS

        </a>

    </div>



    <!-- ===================================== -->
    <!-- MAIN CONTENT -->
    <!-- ===================================== -->

    <div class="home-main-content">


        <!-- ================================= -->
        <!-- LEFT PANEL -->
        <!-- ================================= -->

        <div class="home-left-panel">

            <h1 class="home-title-label">
                AMONG US
            </h1>


            <div class="home-menu-buttons">


                <!-- PLAY -->
                <a
                        id="playLink"
                        class="home-menu-button"
                        href="/play.html">

                    PLAY

                </a>


                <!-- INVENTORY -->
                <a
                        id="inventoryLink"
                        class="home-menu-button"
                        href="/inventory.html">

                    INVENTORY

                </a>


                <!-- SHOP -->
                <button
                        type="button"
                        id="shopButton"
                        class="home-menu-button">

                    SHOP

                </button>


                <!-- MY ACCOUNT -->
                <button
                        type="button"
                        id="accountButton"
                        class="home-menu-button">

                    MY ACCOUNT

                </button>


                <!-- SETTINGS -->
                <button
                        type="button"
                        id="settingsButton"
                        class="home-menu-button">

                    SETTING

                </button>

            </div>


            <div class="home-version-label">

                v18a (build num: 7240)

            </div>

        </div>



        <!-- ================================= -->
        <!-- RIGHT PANEL -->
        <!-- ================================= -->

        <div class="home-right-panel">

            <div class="character-gif-area">

                <span class="placeholder-label">
                    Character GIF Area
                </span>


                <!--
                Character GIF ထည့်ချင်ရင်

                <img
                    src="Image/character.gif"
                    class="character-gif"
                    alt="Character">
                -->

            </div>

        </div>

    </div>

</div>



<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            console.log("HOME PAGE JS LOADED");


            // =====================================
            // GET USERNAME
            // =====================================

            var params =
                new URLSearchParams(
                    window.location.search
                );var username =
            params.get("user");


        if (!username) {

            username =
                sessionStorage.getItem(
                    "username"
                );
        }


        // Login မဝင်ထားရင် login page ပြန်ပို့
        if (!username ||
            username.trim() === "") {

            window.location.replace(
                "/login.html"
            );

            return;
        }


        // Save username
        sessionStorage.setItem(
            "username",
            username
        );


        // =====================================
        // SHOW USERNAME
        // =====================================

        var playerName =
            document.getElementById(
                "playerName"
            );


        playerName.textContent =
            username;



        // =====================================
        // COINS
        // =====================================

        var coins =
            params.get("coins");


        if (!coins) {

            coins =
                sessionStorage.getItem(
                    "coins"
                );
        }


        if (!coins) {

            coins = "0";
        }


        sessionStorage.setItem(
            "coins",
            coins
        );


        document.getElementById(
            "coinLabel"
        ).textContent =
            coins;



        // =====================================
        // ROOM CODE
        // =====================================

        var roomCode =
            sessionStorage.getItem(
                "roomCode"
            );


        if (!roomCode) {

            roomCode =
                "ROOM" +
                Math.floor(
                    1000 +
                    Math.random() * 9000
                );


            sessionStorage.setItem(
                "roomCode",
                roomCode
            );
        }



        // =====================================
        // PLAY LINK
        // =====================================

        var playLink =
            document.getElementById(
                "playLink"
            );


        playLink.href =
            "/play.html?room=" +
            encodeURIComponent(roomCode) +
            "&user=" +
            encodeURIComponent(username);



        // =====================================
        // INVENTORY LINK
        // =====================================

        var inventoryLink =
            document.getElementById(
                "inventoryLink"
            );


        inventoryLink.href =
            "/inventory.html?room=" +
            encodeURIComponent(roomCode) +
            "&user=" +
            encodeURIComponent(username);



        // =====================================
        // FRIENDS LINK
        // =====================================

        var friendsLink =
            document.getElementById(
                "friendsLink"
            );


        friendsLink.href =
            "/friends.html?user=" +
            encodeURIComponent(username);



        // =====================================
        // SHOP BUTTON
        // =====================================

        document.getElementById(
            "shopButton"
        ).addEventListener(
            "click",
            function () {

                alert(
                    "SHOP\n\nComing soon..."
                );
            }
        );



        // =====================================
        // MY ACCOUNT
        // =====================================

        document.getElementById(
            "accountButton"
        ).addEventListener(
            "click",
            function () {

                var email =
                    sessionStorage.getItem(
                        "email"
                    );


                var friendCode =
                    sessionStorage.getItem(
                        "friendCode"
                    );


                if (!email) {

                    email =
                        "No email";
                }if (!friendCode) {

                    friendCode =
                        "No friend code";
                }


                alert(
                    "MY ACCOUNT\n\n" +
                    "Username: " +
                    username +
                    "\n\nEmail: " +
                    email +
                    "\n\nFriend Code: " +
                    friendCode +
                    "\n\nCoins: " +
                    coins
                );
            }
        );



        // =====================================
        // SETTINGS
        // =====================================

        document.getElementById(
            "settingsButton"
        ).addEventListener(
            "click",
            function () {

                alert(
                    "SETTINGS\n\nComing soon..."
                );
            }
        );


        console.log(
            "Home user:",
            username
        );


        console.log(
            "Friends URL:",
            friendsLink.href
        );

    }
);

</script>

</body>

</html>
