<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Online Game - Home Page</title>

    <link rel="stylesheet"
          href="homepage.css">
</head>


<body class="home-game-body">

<div class="home-game-container">


    <!-- ===================================== -->
    <!-- TOP BAR -->
    <!-- ===================================== -->

    <div class="home-top-bar">

        <div class="player-info">

            <span class="player-icon">●</span>

            <span class="player-name" id="playerName">
                Player
            </span>

        </div>


        <div class="top-bar-spacer"></div>


        <div class="coin-area">

            <span class="coin-icon">●</span>

            <span class="coin-text" id="coinLabel">
                0
            </span>

        </div>


        <a id="friendsLink"
           class="friends-button"
           href="/friends.html">
            FRIENDS
        </a>

    </div>



    <!-- ===================================== -->
    <!-- MAIN CONTENT -->
    <!-- ===================================== -->

    <div class="home-main-content">


        <!-- LEFT PANEL -->

        <div class="home-left-panel">

            <h1 class="home-title-label">
                AMONG US
            </h1>


            <div class="home-menu-buttons">

                <a id="playLink"
                   class="home-menu-button"
                   href="/play.html">
                    PLAY
                </a>


                <a id="inventoryLink"
                   class="home-menu-button"
                   href="/inventory.html">
                    INVENTORY
                </a>


                <button type="button"
                        id="shopButton"
                        class="home-menu-button">
                    SHOP
                </button>


                <button type="button"
                        id="accountButton"
                        class="home-menu-button">
                    MY ACCOUNT
                </button>


                <button type="button"
                        id="settingsButton"
                        class="home-menu-button">
                    SETTING
                </button>

            </div>


            <div class="home-version-label">
                v18a (build num: 7240)
            </div>

        </div>



        <!-- RIGHT PANEL -->

        <div class="home-right-panel">

            <div class="character-gif-area">

                <span class="placeholder-label">
                    Character GIF Area
                </span>

            </div>

        </div>

    </div>

</div>



<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            console.log("HOME PAGE JS LOADED");


            /* =====================================
               USERNAME
            ===================================== */

            var params =
                new URLSearchParams(
                    window.location.search
                );

            var username =
                params.get("user");


            if (!username) {

                username =
                    sessionStorage.getItem(
                        "username"
                    );
            }


            if (!username ||
                username.trim() === "") {

                window.location.replace(
                    "/login.html"
                );

                return;
            }


            sessionStorage.setItem(
                "username",
                username
            );


            /* =====================================
               SHOW USERNAME
            ===================================== */

            document.getElementById(
                "playerName"
            ).textContent = username;



            /* =====================================
               COINS
            ===================================== */

            var coins =
                params.get("coins");


            if (!coins) {

                coins =
                    sessionStorage.getItem("coins");
            }


            if (!coins) {

                coins = "0";
            }


            sessionStorage.setItem(
                "coins",
                coins
            );


            document.getElementById(
                "coinLabel"
            ).textContent = coins;



            /* =====================================
               ROOM CODE
            ===================================== */

            var roomCode =
                sessionStorage.getItem("roomCode");


            if (!roomCode) {

                roomCode =
                    "ROOM" +
                    Math.floor(
                        1000 +
                        Math.random() * 9000
                    );


                sessionStorage.setItem(
                    "roomCode",
                    roomCode
                );
            }



            /* =====================================
               PLAY LINK
            ===================================== */

            document.getElementById(
                "playLink"
            ).href =
                "/play.html?room=" +
                encodeURIComponent(roomCode) +
                "&user=" +
                encodeURIComponent(username);



            /* =====================================
               INVENTORY LINK
            ===================================== */

            document.getElementById(
                "inventoryLink"
            ).href =
                "/inventory.html?room=" +
                encodeURIComponent(roomCode) +
                "&user=" +
                encodeURIComponent(username);



            /* =====================================
               FRIENDS LINK
            ===================================== */

            document.getElementById(
                "friendsLink"
            ).href =
                "/friends.html?user=" +
                encodeURIComponent(username);



            /* =====================================
               SHOP BUTTON
            ===================================== */

            document.getElementById(
                "shopButton"
            ).addEventListener(
                "click",
                function () {

                    playClickSound();

                    alert("SHOP\n\nComing soon...");
                }
            );



            /* =====================================
               MY ACCOUNT
            ===================================== */

            document.getElementById(
                "accountButton"
            ).addEventListener(
                "click",
                function () {

                    playClickSound();


                    var email =
                        sessionStorage.getItem("email")
                        || "No email";


                    var friendCode =
                        sessionStorage.getItem("friendCode")
                        || "No friend code";


                    alert(
                        "MY ACCOUNT\n\n" +
                        "Username: " + username +
                        "\n\nEmail: " + email +
                        "\n\nFriend Code: " + friendCode +
                        "\n\nCoins: " + coins
                    );
                }
            );



            /* =====================================
               SETTINGS  ← ဒီမှာ ပြင်ပြီး
            ===================================== */

            document.getElementById(
                "settingsButton"
            ).addEventListener(
                "click",
                function () {

                    /* Click SFX */

                    playClickSound();


                    /* Music ခဏ ရပ် */

                    if (typeof bgMusic !== "undefined" && bgMusic) {

                        bgMusic.pause();
                    }


                    /* Settings page ကို သွား */

                    window.location.href =
                        "/settings.html?user=" +
                        encodeURIComponent(username);
                }
            );



            /* =====================================
               CLICK SFX FOR LINKS
            ===================================== */

            document.getElementById(
                "playLink"
            ).addEventListener(
                "click",
                function () { playClickSound(); }
            );


            document.getElementById(
                "inventoryLink"
            ).addEventListener(
                "click",
                function () { playClickSound(); }
            );


            document.getElementById(
                "friendsLink"
            ).addEventListener(
                "click",
                function () { playClickSound(); }
            );



            /* =====================================
               BACKGROUND MUSIC
            ===================================== */

            startBackgroundMusic();

        }
    );



    /* ============================================================
       BACKGROUND MUSIC
    ============================================================ */

    var bgMusic =
        new Audio('/sounds/Horror.mp3');

    bgMusic.loop = true;



    function applyMusicVolume() {

        var saved =
            localStorage.getItem('gameSettings');


        if (saved) {

            try {

                var s = JSON.parse(saved);

                bgMusic.volume = s.music / 100;

            }

            catch (err) {

                bgMusic.volume = 0.4;
            }

        }

        else {

            bgMusic.volume = 0.4;
        }
    }



    /* ============================================================
       CLICK SFX
    ============================================================ */

           /* ============================================================
       CLICK SFX
    ============================================================ */

    function playClickSound() {

        var sfx =
            new Audio('/sounds/MouseClick.mp3');


        var saved =
            localStorage.getItem('gameSettings');

        var vol = 0.65;


        if (saved) {

            try {

                vol =
                    JSON.parse(saved).sfx / 100;

            }

            catch (e) {}
        }


        sfx.volume = vol;

        // အသံကို အစကနေ ပြန်စဖို့ (ခလုတ်အမြန်နှိပ်ရင် အသံပြတ်မနေစေဖို့)
        sfx.currentTime = 0;

        sfx.play().catch(function () {});
    }


    /* ============================================================
       START MUSIC
    ============================================================ */

    function startBackgroundMusic() {

        applyMusicVolume();


        bgMusic.play().catch(function (err) {

            console.log("Music blocked:", err);


            /* Autoplay block ဖြစ်ရင်
               ပထမ click မှာ စမယ် */

            document.addEventListener(
                "click",
                function () {

                    bgMusic.play().catch(function () {});

                },
                { once: true }
            );
        });
    }

</script>

</body>

</html>
