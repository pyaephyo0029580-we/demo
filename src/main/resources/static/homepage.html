<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Game - Home Page</title>
    <link rel="stylesheet" href="homepage.css">
</head>
<body class="home-game-body">

<div class="home-game-container">

    <!-- TOP BAR -->
    <div class="home-top-bar">
        <span class="player-icon">🟢</span>
        <span class="player-name" id="playerName">XXXXXXXXXX</span>

        <div class="top-bar-spacer"></div>

        <span class="coin-icon">●</span>
        <span class="coin-text" id="coinLabel">0</span>
        <button type="button" class="friends-button" onclick="openFriends()">
            FRIENDS
        </button>
    </div>

    <!-- LEFT MENU PANEL -->
    <div class="home-left-panel">
        <h1 class="home-title-label">AMONG US</h1>

        <div class="home-menu-buttons">
            <button class="home-menu-button" onclick="openPlay()">PLAY</button>
            <button class="home-menu-button" onclick="openInventory()">INVENTORY</button>
            <button class="home-menu-button" onclick="openShop()">SHOP</button>
            <button class="home-menu-button" onclick="openMyAccount()">MY ACCOUNT</button>
            <button class="home-menu-button" onclick="openSetting()">SETTING</button>
        </div>

        <div class="home-version-label">v18a (build num: 7240)</div>
    </div>

    <!-- RIGHT CONTENT PANEL (GIF Area) -->
    <div class="home-right-panel">
        <div class="character-gif-area">
            <span class="placeholder-label">Character GIF Area</span>

            <!-- Character GIF ထည့်ချင်ပါက အောက်ပါ tag တွင် src လမ်းကြောင်း ပြင်၍ သုံးနိုင်ပါသည် -->
            <!-- <img src="/Map/jellyb-removebg-preview.png" class="character-gif" alt="Character"> -->
        </div>
    </div>

</div>

<script>
    // ===== 1. URL Parameters မှ User info ယူခြင်း =====
    const params = new URLSearchParams(window.location.search);
    const username = params.get('user') || 'Player';
    const coins = params.get('coins') || '0';

    if (document.getElementById('playerName')) {
        document.getElementById('playerName').innerText = username;
    }
    if (document.getElementById('coinLabel')) {
        document.getElementById('coinLabel').innerText = coins;
    }

    // ===== 2. Button Actions =====

    // PLAY Button နှိပ်ပါက WebController မှတစ်ဆင့် Map & Character ရှိသော player.html သို့ ပို့ပေးမည်
    function openPlay() {
        const roomCode = 'ROOM' + Math.floor(1000 + Math.random() * 9000);
        const url = `/player?room=${roomCode}&user=${encodeURIComponent(username)}`;

        if (confirm(`Room: ${roomCode}\n\nဒီ Room ထဲ ဝင်ဆော့မှာလား?`)) {
            window.location.href = url;
        }
    }

    function openInventory() {
        alert('📦 INVENTORY\n\nInventory page will open here.');
    }

    function openShop() {
        alert('🛒 SHOP\n\nShop page will open here.');
    }

    function openMyAccount() {
        alert(`👤 MY ACCOUNT\n\nName: ${username}\nCoins: ${coins}`);
    }

    function openSetting() {
        alert('⚙️ SETTINGS\n\nSettings page will open here.');
    }

    function openFriends() {
        window.location.href = "friends.html";
    }
</script>

</body>
</html>
